        </label>
      </div>

      ${c.wakeupTime ? `<div class="status-pill ${st.code}">${st.label}${(st.code==='pending' || st.score===0) ? '' : ` · ${fmtScore10(st.score)}점`}</div>` : ''}

      <p class="photo-note">📎 첨부한 사진은 압축되어 저장되며, 인증을 저장한 뒤에도 캘린더·기록 화면에서 계속 확인할 수 있어요</p>
      <div class="checkin-bottom-spacer"></div>
    </div>

    <div class="checkin-submit-bar">
      <button class="submit-btn" id="btn-submit-checkin">✓ ${ds} 인증 저장</button>
    </div>
  `;

  document.getElementById('btn-checkin-back').addEventListener('click', ()=>{
    checkinStage = 'grid';
    renderCheckin();
  });

  setupPhotoUpload('wakeup', 'ci-wakeup-time', c.wakeupPhotoKey, member, ds);
  setupPhotoUpload('activity', null, c.activityPhotoKey, member, ds);
  setupRoutineTracker(member, ds);

  /* 시간 입력칸을 탭하면 전체 선택되어 backspace/새 입력이 바로 가능 */
  document.querySelectorAll('.time-field input[type=time]').forEach(inp=>{
    inp.addEventListener('focus', ()=>{ try{ inp.select(); }catch(e){} });
    inp.addEventListener('click', ()=>{ try{ inp.select(); }catch(e){} });
  });

  const selfHold = document.getElementById('ci-self-hold');
  function syncHoldUI(){
    const held = selfHold.checked;
    document.getElementById('block-wakeup').classList.toggle('disabled-area', held);
    document.getElementById('block-activity').classList.toggle('disabled-area', held);
    document.getElementById('btn-submit-checkin').textContent = held ? `✓ ${ds} 주말대체인증 저장` : `✓ ${ds} 인증 저장`;
  }
  selfHold.addEventListener('change', async ()=>{
    syncHoldUI();
    if(selfHold.checked){
      /* 체크하는 즉시 주말대체인증 상태로 저장해서 캘린더·대시보드에 바로 반영 */
      let rec = getCheckin(member.id, ds);
      if(!rec){ rec = {id:'c_'+Date.now(), memberId:member.id, date:ds}; checkins.push(rec); }
      rec.held = true;
      await saveCheckins();
      toast('주말대체인증으로 표시했어요 ⏳ (캘린더에도 반영돼요)');
      renderCalendar(); renderDashboard(); renderHero(); renderHistory();
    } else {
      /* 체크를 해제하면, 이전에 저장돼 있던 보류(주말대체인증) 상태를 즉시 취소해서
         전체 인증을 새로 채우기 전이라도 캘린더 등에 바로 반영되게 한다 */
      const rec = getCheckin(member.id, ds);
      if(rec && rec.held){
        rec.held = false;
        await saveCheckins();
        toast('주말대체인증 신청을 취소했어요');
        renderCalendar(); renderDashboard(); renderHero(); renderHistory();
      }
    }
  });
  syncHoldUI();

  const submitBtn = document.getElementById('btn-submit-checkin');
  submitBtn.addEventListener('click', async ()=>{
    /* 신원 확인(PIN)은 이름 그리드 단계에서 이미 끝났으므로, 여기서는 인증 내용만 검사한다 */
    if(!selfHold.checked){
      if(isCertBlockedNow()){ certBlockedToast(); return; }
      const wt = document.getElementById('ci-wakeup-time').value;
      if(!wt){ toast('기상 시간은 필수예요'); return; }
      if(!wakeupPhotoData && !c.wakeupPhoto){ toast('기상 인증 사진을 첨부해주세요'); return; }
    }
    let rec = getCheckin(member.id, ds);
    if(!rec){ rec = {id:'c_'+Date.now(), memberId:member.id, date:ds}; checkins.push(rec); }
    if(selfHold.checked){
      rec.held = true;
      rec.wakeupTime = null; rec.activityTime = null; rec.memo = '';
      rec.wakeupPhoto = false; rec.activityPhoto = false;
      rec.wakeupPhotoKey = null; rec.activityPhotoKey = null;
      rec.routineChecks = null;
      wakeupPhotoData = null; activityPhotoData = null;
      await saveCheckins();
      toast('오늘은 주말대체인증으로 표시했어요 ⏳');
      renderAll();
      return;
    }
    const wt = document.getElementById('ci-wakeup-time').value;
    rec.held = false;
    rec.wakeupTime = wt;
    /* 모닝루틴 인증: 해빗트래커 체크(기상+30~60분 창) 우선, 없으면 인증사진으로 기록된 시각 유지 */
    rec.activityTime = routineCertifiedTime(member, ds, wt) || rec.activityTime || null;
    rec.wakeupPhoto = rec.wakeupPhoto || !!wakeupPhotoData;
    if(wakeupPhotoData){
      rec.wakeupPhotoKey = rec.wakeupPhotoKey || ('gt:photo:'+rec.id+':wakeup');
      await savePhoto(rec.wakeupPhotoKey, wakeupPhotoData);
    }
    await saveCheckins();
    wakeupPhotoData = null;
    toast('인증이 저장됐어요 🌱');
    renderAll();
  });
}

/* ---- photo upload helpers ---- */
/* 새벽 0시~4시 사이에는 어떤 인증 기록(사진 업로드/체크/저장)도 남기지 못하게 막는다 */
function isCertBlockedNow(){
  const h = new Date().getHours();
  return h>=0 && h<4;
}
function certBlockedToast(){
  toast('🌙 새벽 12시~4시 사이에는 인증할 수 없어요. 4시 이후에 다시 시도해주세요');
}
function photoPreviewHtml(dataUrl){
  return `<div class="photo-preview"><img src="${dataUrl}" alt="인증 사진"/><button type="button" class="photo-remove">✕</button></div>`;
}
function savedPhotoHtml(dataUrl){
  return `<div class="photo-preview"><img src="${dataUrl}" alt="저장된 인증 사진"/><button type="button" class="photo-remove">✕</button></div>`;
}
function photoPlaceholderHtml(idHint, label, hint){
  return `<div class="photo-placeholder"><span class="ic">📷</span><p>${label}</p><span>${hint}</span></div>`;
}
/* 오늘인증 폼에 떠있는 "상태 알약"(성공/미인증 등)을 즉시 새로고침 없이 갱신.
   사진 업로드로 자동저장됐을 때, 알약이 아직 화면에 없으면 새로 만들어 끼워넣는다 */
function refreshCheckinStatusPill(member, ds){
  const area = document.getElementById('checkin-form-area');
  if(!area) return;
  const c2 = getCheckin(member.id, ds) || {};
  let pill = area.querySelector('.status-pill');
  if(!(c2.wakeupTime || c2.held)){
    if(pill) pill.remove();
    return;
  }
  const st2 = dayStatus(member, ds);
  const html = st2.label + ((st2.code==='pending' || st2.score===0) ? '' : ' · ' + fmtScore10(st2.score) + '점');
  if(!pill){
    pill = document.createElement('div');
    const note = area.querySelector('.photo-note');
    if(note) area.insertBefore(pill, note); else area.appendChild(pill);
  }
  pill.className = 'status-pill ' + st2.code;
  pill.innerHTML = html;
}

function setupPhotoUpload(prefix, timeFieldId, savedKey, member, ds){
  const box = document.getElementById(prefix+'-photo-box');
  const input = document.getElementById(prefix+'-photo-input');
  const label = prefix==='wakeup' ? '기상 인증 사진 업로드' : '모닝루틴 사진 업로드';
  const hint = prefix==='wakeup' ? '치약 짠 칫솔 + 타임스탬프가 함께 보이는 사진을 첨부하세요' : '루틴과 어울리는 사진을 타임스탬프와 함께 올려주세요';
  const clearTimeField = ()=>{ const tf=document.getElementById(timeFieldId); if(tf) tf.value=''; };
  const bindPlaceholder = ()=>{ box.querySelector('.photo-placeholder')?.addEventListener('click', ()=> input.click()); };
  const showPlaceholder = ()=>{ box.innerHTML = photoPlaceholderHtml(prefix, label, hint); bindPlaceholder(); };
  /* 사진 프리뷰 공통 바인딩: 탭하면 크게보기, ✕ 누르면 '그 사진에 해당하는 기록만' 삭제
     (예전엔 모닝루틴 사진을 지워도 기상 기록까지 통째로 사라지는 버그가 있었음) */
  const bindSaved = (dataUrl)=>{
    box.querySelector('.photo-preview img')?.addEventListener('click', ()=> openPhotoOverlay(dataUrl));
    box.querySelector('.photo-remove')?.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const isWake = prefix==='wakeup';
      let ok;
      if(isWake){
        /* A안: 기상시간을 지우면 그날 전체가 미인증 처리된다는 걸 정확히 경고.
           실수로 지우는 걸 막기 위해 같은 경고를 두 번 확인받는다 */
        const warnMsg = '⚠️ 기상 시간을 지우면 오늘 전체가 미인증 처리돼요.\n모닝루틴을 이미 체크했어도, 오늘 하루는 인증 실패로 바뀌어요.\n정말 삭제할까요?';
        ok = confirm(warnMsg) && confirm(warnMsg);
      } else {
        ok = confirm('모닝루틴 인증 사진을 삭제할까요? (기상 인증과 해빗트래커 체크는 유지)');
      }
      if(!ok) return;
      const rec = getCheckin(member.id, ds);
      if(rec){
        try{
          if(isWake && rec.wakeupPhotoKey) await window.storage.delete(rec.wakeupPhotoKey);
          if(!isWake && rec.activityPhotoKey) await window.storage.delete(rec.activityPhotoKey);
        }catch(e){}
        if(isWake){
          rec.wakeupPhoto = false; rec.wakeupPhotoKey = null; rec.wakeupTime = null;
        } else {
          rec.activityPhoto = false; rec.activityPhotoKey = null;
          /* 사진을 지워도 해빗트래커 체크로 인증된 시각이 있으면 그건 유지 */
          rec.activityTime = routineCertifiedTime(member, ds, rec.wakeupTime || '') || null;
        }
        /* 기상·루틴 모두 비었고 다른 기록도 없으면 그때만 레코드 자체를 정리 */
        const empty = !rec.wakeupPhoto && !rec.activityPhoto && !rec.wakeupTime && !rec.activityTime
                      && !rec.held && !(rec.routineChecks||[]).some(x=>x&&x.done);
        if(empty){ const idx = checkins.findIndex(x=>x.id===rec.id); if(idx>=0) checkins.splice(idx,1); }
        await saveCheckins();
      }
      if(isWake) wakeupPhotoData=null; else activityPhotoData=null;
      input.value='';
      toast(isWake ? '기상 인증 사진을 삭제했어요' : '모닝루틴 사진을 삭제했어요');
      renderAll();
    });
  };
  bindPlaceholder();
  if(prefix==='wakeup' && wakeupPhotoData) bindSaved(wakeupPhotoData);
  /* 저장된 사진이 있으면 자동으로 불러와 화면에 바로 보여준다 */
  const hasNew = prefix==='wakeup' ? !!wakeupPhotoData : !!activityPhotoData;
  if(savedKey && !hasNew){
    loadPhoto(savedKey).then(dataUrl=>{
      if(!dataUrl){ showPlaceholder(); return; }
      const stillNoNew = prefix==='wakeup' ? !wakeupPhotoData : !activityPhotoData;
      if(!stillNoNew) return; // 그 사이 새 사진을 첨부했다면 덮어쓰지 않음
      box.innerHTML = savedPhotoHtml(dataUrl);
      bindSaved(dataUrl);
    });
  }
  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    if(isCertBlockedNow()){ certBlockedToast(); input.value=''; return; }
    if(prefix==='activity' && !adminMode){
      const wrec = getCheckin(member.id, ds);
      const wakeupDone = !!(wrec && wrec.wakeupTime && wrec.wakeupTime!=='보충' && !wrec.held && wrec.wakeupPhoto);
      if(!wakeupDone){ toast('먼저 기상 인증(STEP 1)을 완료해주세요'); input.value=''; return; }
    }
    if(!firebaseReady){ toast('⚠️ 지금은 임시 저장 모드예요 — 이 사진은 새로고침하면 사라져요!'); }
    const origKB = Math.round(file.size/1024);
    toast('사진 압축 중...');
    try{
      const dataUrl = await compressImage(file);
      if(prefix==='wakeup') wakeupPhotoData = dataUrl; else activityPhotoData = dataUrl;
      const tf = timeFieldId ? document.getElementById(timeFieldId) : null;
      /* 1순위: EXIF 촬영 시각 → 2순위: 파일 시각 */
      let detected = '', timeSource = '';
      const exifTime = await readExifTime(file);
      if(exifTime){ detected = exifTime; timeSource = '촬영정보'; }
      else {
        const lm = new Date(file.lastModified);
        if(lm && !isNaN(lm)){ detected = pad(lm.getHours())+':'+pad(lm.getMinutes()); timeSource = '파일시간'; }
      }
      if(tf && detected) tf.value = detected;
      /* 업로드 즉시 저장소에 영구 저장 → 페이지를 나갔다 와도 당일 사진이 유지됨 */
      let rec = getCheckin(member.id, ds);
      if(!rec){ rec = {id:'c_'+Date.now(), memberId:member.id, date:ds, held:false}; checkins.push(rec); }
      const photoKey = 'gt:photo:'+rec.id+':'+prefix;
      if(prefix==='wakeup'){
        rec.wakeupPhotoKey = photoKey; rec.wakeupPhoto = true;
        /* 기상 인증 사진에 타임스탬프가 감지되면, "인증 저장" 버튼을 누르지 않아도
           그 시간으로 바로 인증 완료 처리한다 (버튼은 이후 사진 재첨부·수정용으로만 필요) */
        if(detected){ rec.wakeupTime = detected; rec.held = false; }
      }
      else {
        rec.activityPhotoKey = photoKey; rec.activityPhoto = true;
        /* 모닝루틴 사진은 '업로드한 시각'을 인증 시각으로 기록.
           단, 해빗트래커 체크로 이미 인증된 시각이 있으면 체크 기준을 우선 적용 */
        const uploadedAt = nowHM();
        rec.activityTime = routineCertifiedTime(member, ds, rec.wakeupTime || '') || uploadedAt;
      }
      await savePhoto(photoKey, dataUrl);
      await saveCheckins();
      box.innerHTML = savedPhotoHtml(dataUrl);
      bindSaved(dataUrl);
      /* 기록·캘린더·대시보드에도 즉시 반영 (체크인 화면은 유지) */
      renderHistory(); renderCalendar(); renderDashboard(); renderHero();
      if(prefix==='wakeup') refreshCheckinStatusPill(member, ds);
      if(prefix==='activity' && window.__refreshRoutineStatus) window.__refreshRoutineStatus(); /* ✅ 인증 완료 표시 즉시 갱신 */
      const newKB = dataUrlSizeKB(dataUrl);
      toast(`사진 저장 완료 (${origKB}KB→${newKB}KB)${timeSource? ' · '+timeSource+'로 시간 자동입력·자동저장':''}`);
      /* 3단계: 백그라운드에서 사진 속 타임스탬프 글자를 OCR로 읽어 보정 — 기상 사진에만 적용
         (모닝루틴 사진은 '업로드한 시각' 기준이므로 사진 속 시간으로 덮어쓰지 않음) */
      if(prefix==='wakeup') ocrTimeFromImage(dataUrl).then(async t=>{
        if(!t) return;
        const stillSame = wakeupPhotoData === dataUrl;
        if(!stillSame) return; // 그 사이 다른 사진으로 바뀌었으면 무시
        if(tf && tf.value !== t){
          tf.value = t;
          /* OCR로 보정된 시간도 버튼 없이 바로 자동저장 */
          const rec2 = getCheckin(member.id, ds);
          if(rec2){
            rec2.wakeupTime = t; rec2.held = false;
            await saveCheckins();
            renderHistory(); renderCalendar(); renderDashboard(); renderHero();
            refreshCheckinStatusPill(member, ds);
          }
          toast(`📷 사진 속 타임스탬프(${t})를 읽어 시간을 보정했어요 (자동저장됨)`);
        }
      });
    }catch(err){
      console.error(err);
      toast('사진을 처리하지 못했어요. 다시 시도해주세요');
    }
  });
}

/* ---- 모닝루틴 해빗트래커 ---- */
const GOAL_SLOTS = 2;   /* 모닝루틴 목표 칸 수 (2개 고정) */
function memberGoals(member){
  if(Array.isArray(member.goals)) return member.goals.slice(0, GOAL_SLOTS).concat(Array(GOAL_SLOTS).fill('')).slice(0, GOAL_SLOTS);
  return [member.goal||'', ''];
}
function nowHM(){ const n=new Date(); return pad(n.getHours())+':'+pad(n.getMinutes()); }
/* 현재 시각이 기상시간 기준 몇 분 뒤인지 (기상시간 미입력이면 null) */
function minutesSinceWake(wakeTime){
  const w = timeToMinutes(wakeTime); if(w==null) return null;
  const n = new Date();
  return (n.getHours()*60+n.getMinutes()) - w;
}
/* 모닝루틴 인증 창의 시작(하한)과 끝(상한)을 계산.
   하한은 항상 '실제 기상시간 +30분' (다시 잠들지 않도록 하는 최소 대기시간, 예외 없음)
   상한은 보통 '실제 기상시간 +60분'이지만, 목표시간보다 일찍 일어난 경우는
   '목표 기상시간 +60분'까지로 늘어나요 (일찍 일어난 만큼 인증할 시간도 넉넉하게). */
function routineWindow(wakeTime, targetTime){
  const w = timeToMinutes(wakeTime); if(w==null) return null;
  const t = timeToMinutes(targetTime);
  const isEarly = (t!=null && w < t);
  const min = w + 30;
  const max = isEarly ? t + 60 : w + 60;
  return { ref: w, min, max, isEarly };
}
function minutesNow_(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
/* 인증 성공 시각 계산: 작성된 목표 중 1개 이상 체크됐고, 그 마지막 체크가 인증 창(기상 또는 목표시간 기준) 안이면 그 시각 반환 */
function routineCertifiedTime(member, ds, wakeTime){
  const rec = getCheckin(member.id, ds);
  const checks = rec && rec.routineChecks;
  if(!checks || !wakeTime) return null;
  const goals = memberGoals(member).map((g,i)=>({g,i})).filter(x=>x.g.trim());
  if(goals.length===0) return null;
  const checkedGoals = goals.filter(x=> checks[x.i] && checks[x.i].done);
  if(checkedGoals.length===0) return null; // 3개 중 1개만 체크해도 인증 완료
  const times = checkedGoals.map(x=>timeToMinutes(checks[x.i].time)).filter(t=>t!=null);
  if(times.length===0) return null;
  const last = Math.max(...times);
  const win = routineWindow(wakeTime, member.targetTime); if(!win) return null;
  if(last >= win.min && last <= win.max){
    return pad(Math.floor(last/60))+':'+pad(last%60);
  }
  return null;
}
/* ⭐ 목표 달성률: 그날 '작성된 목표' 중 인증 창 안에 체크된 목표의 비율(0~1)
   - 목표를 하나도 안 적었으면 측정 대상이 없으므로 1(만점) 처리
   - 체크는 하나도 없지만 모닝루틴 사진으로 인증했으면 1(만점) 처리
   - 인증 창(기상 후 30~60분, 일찍 일어난 날은 목표시간+60분)을 벗어난 체크는 인정하지 않음 */
function goalProgress(member, ds, wakeTime){
  const rec = getCheckin(member.id, ds);
  const goals = memberGoals(member).map((g,i)=>({g,i})).filter(x=>x.g && x.g.trim());
  const total = goals.length;
  if(total===0) return {done:1, total:1, rate:1, measured:false};
  const checks = (rec && rec.routineChecks) || [];
  const anyCheck = Array.isArray(checks) && checks.some(x=>x && x.done);
  if(!anyCheck){
    /* 체크 기록이 아예 없는 날(사진으로만 인증했거나 이 기능 도입 이전의 과거 기록)은 만점 처리 */
    if(rec && rec.activityTime) return {done:total, total, rate:1, measured:false};
    return {done:0, total, rate:0, measured:true};
  }
  const win = routineWindow(wakeTime, member.targetTime);
  let done = 0;
  if(win){
    goals.forEach(x=>{
      const ck = checks[x.i];
      if(!ck || !ck.done) return;
      const t = timeToMinutes(ck.time);
      if(t!=null && t >= win.min && t <= win.max) done++;
    });
  }
  return {done, total, rate: done/total, measured:true};
}

function setupRoutineTracker(member, ds){
  const listEl = document.getElementById('routine-list');
  const statusEl = document.getElementById('routine-status');
  if(!listEl) return;
  const goals = memberGoals(member);
  /* 사진 업로드 등 바깥에서 루틴 인증 상태 표시를 즉시 갱신할 수 있게 훅으로 노출 */
  window.__refreshRoutineStatus = ()=>{ try{ render(); }catch(e){} };

  function currentWakeTime(){
    const rec = getCheckin(member.id, ds);
    return document.getElementById('ci-wakeup-time')?.value || (rec && rec.wakeupTime) || '';
  }
  /* 기상 시간을 입력만 한 상태가 아니라, 실제로 '기상 인증'이 저장(사진+PIN)됐는지 확인 */
  function hasCertifiedWakeup(){
    const rec = getCheckin(member.id, ds);
    return !!(rec && rec.wakeupTime && rec.wakeupTime!=='보충' && !rec.held && rec.wakeupPhoto);
  }
  function getChecks(){
    const rec = getCheckin(member.id, ds);
    return (rec && rec.routineChecks) || [null,null];
  }
  function isLocked(){
    /* 기상인증 전에는 체크 자체를 막음. 인증 창(기상 후 60분)이 지나도 체크는 계속 가능하지만,
       그 체크는 인증으로 인정되지 않아 누적성공률에는 반영되지 않아요 */
    return !hasCertifiedWakeup() && !adminMode;
  }
  function isTooEarly(){
    const wt = currentWakeTime();
    const win = routineWindow(wt, member.targetTime);
    return win!=null && minutesNow_() < win.min && !adminMode; /* 인증 창이 열리기 전에는 체크 자체를 막음 */
  }
  function render(){
    const checks = getChecks();
    const locked = isLocked();
    listEl.innerHTML = goals.map((g,i)=>{
      const ck = checks[i];
      const examples = ['물 한잔 마시기','모닝 일기 쓰기'];
      return `<div class="routine-item ${ck&&ck.done?'done':''}">
        <input type="checkbox" class="routine-chk" data-idx="${i}" ${ck&&ck.done?'checked':''} ${(locked||isTooEarly())?'disabled':''}/>
        <input type="text" class="routine-goal" data-idx="${i}" value="${(g||'').replace(/"/g,'&quot;')}" placeholder="예: ${examples[i]}"/>
        ${ck&&ck.done&&ck.time? `<span class="routine-time">✓ ${ck.time}</span>` : ''}
      </div>`;
    }).join('');
    const wt = currentWakeTime();
    const rec0 = getCheckin(member.id, ds);
    const photoCert = (rec0 && rec0.activityPhoto && rec0.activityTime) ? rec0.activityTime : null;
    const certified = routineCertifiedTime(member, ds, wt) || photoCert;
    const gp = goalProgress(member, ds, wt);
    let statusHtml = '';
    if(gp.measured && wt){
      const pct = Math.round(gp.rate*100);
      statusHtml += `<span class="rt-rate">🎯 목표 달성률 <b>${gp.done}/${gp.total} (${pct}%)</b>${gp.rate>=1?' — 만점이에요!':` · 지금 저장되면 ${fmtScore10(-Math.round(50*(1-gp.rate)))}점`}</span>`;
    }
    if(!hasCertifiedWakeup() && !adminMode) statusHtml = `<span class="rt-locked">🔒 먼저 기상 인증(STEP 1)을 완료해야 모닝루틴을 체크할 수 있어요</span>`;
    if(certified) statusHtml += `<span class="rt-ok">✅ 모닝루틴 인증 완료 · ${certified}</span>`;
    else if(wt){
      const win = routineWindow(wt, member.targetTime);
      const now = minutesNow_();
      if(win && now < win.min){
        statusHtml += `<span class="rt-wait">⏱ 인증 창은 기상 후 30분부터 열려요 (지금 ${Math.max(0,now-win.ref)}분 지남)</span>`;
      } else if(win && now <= win.max){
        statusHtml += `<span class="rt-wait">🟢 지금 인증 창이에요 — 마지막 체크를 완료하세요!</span>`;
      } else {
        statusHtml += `<span class="rt-wait">⌛ 기상 후 60분이 지났어요 — 지금 체크해도 누적성공률엔 반영되지 않아요</span>`;
      }
    } else {
      statusHtml += `<span class="rt-wait">먼저 기상 시간을 입력하면 인증 창이 계산돼요</span>`;
    }
    statusEl.innerHTML = statusHtml;
    bind();
  }
  function bind(){
    listEl.querySelectorAll('.routine-chk').forEach(chk=>{
      chk.addEventListener('change', async ()=>{
        if(!hasCertifiedWakeup() && !adminMode){ toast('먼저 기상 인증(STEP 1)을 완료해주세요'); chk.checked=false; render(); return; }
        if(chk.checked && isTooEarly()){ toast('기상 후 30분이 지나야 체크할 수 있어요 (다시 잠들지 않도록)'); chk.checked=false; render(); return; }
        if(chk.checked && isCertBlockedNow()){ certBlockedToast(); chk.checked=false; return; }
        if(chk.checked){
          const wt0 = currentWakeTime();
          const win0 = routineWindow(wt0, member.targetTime);
          if(win0 && minutesNow_() > win0.max) toast('⌛ 기상 후 60분이 지나 체크했어요 — 이번 체크는 누적성공률에 반영되지 않아요');
        }
        const i = Number(chk.dataset.idx);
        let rec = getCheckin(member.id, ds);
        if(!rec){ rec = {id:'c_'+Date.now(), memberId:member.id, date:ds, held:false}; checkins.push(rec); }
        if(!Array.isArray(rec.routineChecks)) rec.routineChecks = [null,null];
        rec.routineChecks[i] = chk.checked ? {done:true, time:nowHM()} : null;
        /* 체크 상태가 바뀔 때마다 인증 여부 재계산해서 즉시 반영.
           단, 체크로 인증이 안 되더라도 사진으로 인증한 시각이 있으면 그건 지우지 않고 보존 */
        const photoTime = (rec.activityPhoto && rec.activityTime) ? rec.activityTime : null;
        rec.activityTime = routineCertifiedTime(member, ds, currentWakeTime()) || photoTime;
        await saveCheckins();
        render();
        /* 상태 알약(성공/대기 표시)·캘린더·대시보드에도 즉시 반영 */
        renderCalendar(); renderDashboard(); renderHero(); renderHistory();
        const pill = document.querySelector('#checkin-form-area .status-pill');
        if(pill){
          const st2 = dayStatus(member, ds);
          pill.className = 'status-pill ' + st2.code;
          pill.innerHTML = st2.label + ((st2.code==='pending' || st2.score===0) ? '' : ' · ' + fmtScore10(st2.score) + '점');
        }
      });
    });
    listEl.querySelectorAll('.routine-goal').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const i = Number(inp.dataset.idx);
        if(!Array.isArray(member.goals) || member.goals.length!==GOAL_SLOTS) member.goals = memberGoals(member);
        member.goals[i] = inp.value.trim();
        goals[i] = member.goals[i];
        await saveMembers();
        toast('모닝루틴 목표를 저장했어요');
        render();
      });
    });
  }
  render();
  /* 기상시간이 바뀌면 인증 창 상태도 다시 계산 */
  document.getElementById('ci-wakeup-time')?.addEventListener('change', render);
}

/* ---- 사진에서 시간 자동 인식 ---- */
/* 1) EXIF 촬영 시각 읽기: 카메라로 찍은 JPEG 안에 기록된 '찍은 시각'을 꺼낸다 */
function readExifTime(file){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const buf = reader.result;
        const view = new DataView(buf);
        if(view.byteLength < 4 || view.getUint16(0) !== 0xFFD8){ resolve(null); return; } // JPEG가 아니면 스킵
        let offset = 2;
        while(offset < view.byteLength - 4){
          const marker = view.getUint16(offset);
          if((marker & 0xFF00) !== 0xFF00) break;
          const size = view.getUint16(offset+2);
          if(marker === 0xFFE1){ // APP1(EXIF) 구간에서 'YYYY:MM:DD HH:MM:SS' 패턴 탐색
            const bytes = new Uint8Array(buf, offset+4, Math.min(size, view.byteLength-offset-4));
            const str = new TextDecoder('latin1').decode(bytes);
            const m = str.match(/\d{4}:\d{2}:\d{2} ([01]\d|2[0-3]):([0-5]\d):\d{2}/);
            if(m){ resolve(m[1]+':'+m[2]); return; }
          }
          offset += 2 + size;
        }
      }catch(e){}
      resolve(null);
    };
    reader.onerror = ()=> resolve(null);
    reader.readAsArrayBuffer(file.slice(0, 131072)); // EXIF는 파일 앞부분에 있으므로 128KB만 읽음
  });
}
/* 2) OCR: 사진 위에 찍힌 타임스탬프 글자(예: 06:15)를 직접 읽는다. 필요할 때만 라이브러리 로드 */
let tessLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessLoadPromise) return tessLoadPromise;
  tessLoadPromise = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = res; s.onerror = ()=>{ tessLoadPromise=null; rej(new Error('OCR 라이브러리 로드 실패')); };
    document.head.appendChild(s);
  });
  return tessLoadPromise;
}
async function ocrTimeFromImage(dataUrl){
  try{
    await loadTesseract();
    const result = await Promise.race([
      Tesseract.recognize(dataUrl, 'eng'),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('OCR 시간 초과')), 25000))
    ]);
    const text = (result && result.data && result.data.text) || '';
    const ampm = /(오전|오후|AM|PM|am|pm)/.exec(text);
    const m = /([01]?\d|2[0-3])\s*[:;]\s*([0-5]\d)/.exec(text);
    if(!m) return null;
    let h = parseInt(m[1],10); const mm = m[2];
    if(ampm){
      const a = ampm[1].toLowerCase();
      if((a==='오후'||a==='pm') && h<12) h+=12;
      if((a==='오전'||a==='am') && h===12) h=0;
    }
    return String(h).padStart(2,'0')+':'+mm;
  }catch(e){ console.warn('OCR 실패:', e.message); return null; }
}

  const el = document.getElementById('sec-calendar');

      let cls='cal-cell'+(otherMonth?' other-month':'')+(isWeekend(d)?' weekend':'');

          mark = st.leaf ? `<span class="leaf">${st.leaf}</span>` : '';

        const ratio = members.length? members.filter(m=>hasCheckin(m.id,ds)).length/members.length : 0;

          else if(ratio>0){ cls+=' partial'; mark='<span class="leaf">-</span>'; }

      if(sameDate(d,todayDate)) cls+=' today';
      if(ds===calDetailDate) cls+=' selected';
      gridHtml += `<div class="${cls}" data-date="${ds}">${d.getDate()}${mark}</div>`;
    }
  });
  gridHtml += `</div>`;

  /* 개인별 누적 성공률 + 목표 누적성공률 — 지금 보고 있는 '달' 기준으로 계산 */

      const aTime = c && c.activityTime ? c.activityTime : '';
      const makeBtn = (ok, key, time, section)=>{

    if(calTouchX===null) return;
    const dx = e.changedTouches[0].clientX - calTouchX;

    calTouchX = null; calTouchY = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0){ calViewDate=new Date(year,monthIdx+1,1); } else { calViewDate=new Date(year,monthIdx-1,1); }
      calDetailDate=null; renderCalendar();

  }, {passive:true});
  document.querySelectorAll('.cal-cell[data-date]').forEach(c=>{
    c.addEventListener('click', ()=>{ calDetailDate = (calDetailDate===c.dataset.date) ? null : c.dataset.date; renderCalendar(); });
  });

        <div class="form-row"><label>색상</label><div class="color-row" id="f-colors">${COLORS.map(c=>`<div class="color-dot ${c===m.color?'sel':''}" style="background:${c}" data-c="${c}"></div>`).join('')}</div></div>
        <div class="section-title" style="margin:12px 0 6px;font-size:17px;">🗓 팀원등록일</div>
        <p style="font-size:15px;color:var(--ink-faint);margin:-2px 0 8px;">이 날짜부터 누적 성공률에 반영돼요. 늦게 합류한 팀원은 처음부터 있었던 것처럼 불리해지지 않도록, 이 날짜 이전은 계산에서 빠져요.</p>
        <div class="form-row"><label>등록일</label><input id="f-registered" type="date" value="${m.registeredAt||todayStr()}"/></div>
        <div class="section-title" style="margin:12px 0 6px;font-size:17px;">🏝 인증제외기간 (선택)</div>
        <p style="font-size:15px;color:var(--ink-faint);margin:-2px 0 8px;">이 기간에는 팀원 등록은 유지되지만, 인증하지 않아도 누적 성공률 계산에서 제외돼요 (휴가·병가 등)</p>
        <div class="form-row"><label>제외 시작일</label><input id="f-exempt-start" type="date" value="${m.exemptStart||''}"/></div>
        <div class="form-row"><label>제외 종료일</label><input id="f-exempt-end" type="date" value="${m.exemptEnd||''}"/></div>
        <div class="form-actions">
          <button class="btn btn-mini ghost" id="f-cancel" style="flex:1">취소</button>
          <button class="btn btn-mini" id="f-save" style="flex:1">${editingMemberId?'저장':'추가하기'}</button>
        </div>
      </div>`;
  }

  el.innerHTML = `
    <div class="section-title" style="margin-top:6px; justify-content:space-between;">
      <span>팀원 ${members.length}명</span>
      <span style="display:flex;gap:8px;align-items:center;">
        ${adminMode? `<button class="btn btn-mini" id="btn-add-member">+ 추가</button>` : ''}
        <button class="gear-btn" id="btn-admin-toggle" style="width:38px;height:38px;">⚙</button>
      </span>
    </div>
    ${!adminMode? `<div class="admin-banner"><span class="ic">🔒</span><strong>이 페이지는 관리자만 수정할 수 있어요</strong><p style="margin-top:4px;">위의 ⚙ 버튼으로 관리자 모드를 켜주세요</p></div>` : ''}
    ${listHtml}
    ${formHtml}
  `;
  bindAdminToggle();

  if(adminMode){
    document.getElementById('btn-add-member')?.addEventListener('click', ()=>{ addingMember=true; editingMemberId=null; renderMembers(); });
    document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{ editingMemberId=b.dataset.edit; addingMember=false; renderMembers(); }));
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
      members = members.filter(m=>m.id!==b.dataset.del);
      await saveMembers(); toast('팀원을 삭제했어요'); renderAll();
    }));
    const colorRow = document.getElementById('f-colors');
    if(colorRow){ colorRow.addEventListener('click', (e)=>{ if(e.target.classList.contains('color-dot')){ colorRow.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('sel')); e.target.classList.add('sel'); } }); }
    document.getElementById('f-cancel')?.addEventListener('click', ()=>{ addingMember=false; editingMemberId=null; renderMembers(); });
    document.getElementById('f-save')?.addEventListener('click', async ()=>{
      const name=document.getElementById('f-name').value.trim();
      const time=document.getElementById('f-time').value;
      const pin=document.getElementById('f-pin').value.trim();
      const color=document.querySelector('#f-colors .color-dot.sel')?.dataset.c || COLORS[0];
      const registeredAt=document.getElementById('f-registered').value || todayStr();
      const exemptStart=document.getElementById('f-exempt-start').value || '';
      const exemptEnd=document.getElementById('f-exempt-end').value || '';
      if(!name||!time||pin.length!==4){ toast('이름·기상시간·PIN(4자리)을 입력해주세요'); return; }
      if(exemptStart && exemptEnd && parseDate(exemptStart) > parseDate(exemptEnd)){ toast('인증제외 시작일이 종료일보다 늦을 수 없어요'); return; }
      if(editingMemberId){
        const m = members.find(x=>x.id===editingMemberId);
        Object.assign(m,{name,targetTime:time,pin,color,exemptStart,exemptEnd,registeredAt});
      } else {
        members.push({id:'m_'+Date.now(), name,targetTime:time,pin,color,exemptStart,exemptEnd,registeredAt});
      }
      await saveMembers();
      addingMember=false; editingMemberId=null;
      toast('저장됐어요 🌱'); renderAll();
    });
  }
}
function memberEmoji(goal){
  if(/독서|책/.test(goal)) return '📚';
  if(/러닝|운동|헬스|요가|스트레칭/.test(goal)) return '🏃';
  if(/명상/.test(goal)) return '🧘';
  if(/영어|공부|어학/.test(goal)) return '🗣';
  return '🌱';
}

/* ===================== Render: History ===================== */
function renderHistory(){
  const el = document.getElementById('sec-history');
  let list = [...checkins].filter(c=>c.wakeupTime).sort((a,b)=>b.date.localeCompare(a.date));
  if(histFilterMember) list = list.filter(c=>c.memberId===histFilterMember);
  if(histFilterMonth) list = list.filter(c=>c.date.startsWith(histFilterMonth));

  const memberOpts = members.map(m=>`<option value="${m.id}" ${histFilterMember===m.id?'selected':''}>${m.name}</option>`).join('');

  const rows = list.map(c=>{
    const m = members.find(x=>x.id===c.memberId);
    if(!m) return '';
    const st = dayStatus(m, c.date);
    const badgeStyle = {perfect:'background:var(--green-dim);color:var(--green)', goalpart:'background:#EFE6FB;color:#5A2C8C', wakeup:'background:var(--gold-dim);color:#6B5210', late:'background:#F7EAD2;color:#7A5A12', latewake:'background:#F0ECF8;color:var(--ink-sub)', absent:'background:#EDE7F6;color:var(--ink-faint)'}[st.code];
    const histLabel = st.label.replace('부분인증','모닝루틴'); /* 기록 탭 표시 전용 문구 */
    const wakeupPhotoBtn = c.wakeupPhotoKey ? `<button type="button" class="view-photo-btn" onclick="openPhotoViewer('${c.wakeupPhotoKey}')">📷기상</button> ` : (c.wakeupPhoto ? '📷 ' : '');
    const activityPhotoBtn = c.activityPhotoKey ? `<button type="button" class="view-photo-btn" onclick="openPhotoViewer('${c.activityPhotoKey}')">📷루틴</button> ` : (c.activityPhoto ? '📷 ' : '');
    /* 루틴 시각: 인증 확정 시각이 있으면 그걸, 없으면 해빗트래커 마지막 체크 시각 표시 */
    let routineTime = c.activityTime || '';
    if(!routineTime && Array.isArray(c.routineChecks)){
      const times = c.routineChecks.filter(x=>x&&x.time).map(x=>timeToMinutes(x.time)).filter(t=>t!=null);
      if(times.length){ const last=Math.max(...times); routineTime = pad(Math.floor(last/60))+':'+pad(last%60); }
    }
    return `<div class="hist-row">
      <div class="avatar av-sm2" style="background:${m.color}">${m.name[0]}</div>
      <div style="flex:1">
        <div class="hist-top"><span class="hist-name">${m.name}</span><span class="hist-date">${c.date.slice(5)}</span></div>
        <span class="hist-badge" style="${badgeStyle}">${histLabel}</span>
        <div class="hist-memo">${wakeupPhotoBtn}기상 ${c.wakeupTime}${routineTime? ' · 루틴 '+activityPhotoBtn+routineTime:''}${c.memo? ' — '+c.memo:''}</div>
      </div>
      ${adminMode? `<button class="icon-btn hist-edit" data-edit-rec="${c.id}">✎</button><button class="icon-btn hist-del" data-del="${c.id}">🗑</button>`:''}
    </div>
    ${(adminMode && editingRecordId===c.id) ? renderAdminEditCard(c, m) : ''}`;
  }).join('') || `<div class="empty-state"><span class="ic">🔍</span>기록이 없습니다</div>`;

  el.innerHTML = `
    <div class="section-title" style="margin-top:6px; justify-content:space-between;">
      <span>인증 기록</span>
      <span style="font-size:16.5px; color:${adminMode?'var(--green)':'var(--ink-faint)'}; font-weight:700;">${adminMode?'🔓 관리자 모드':'🔒 보기 전용'}</span>
    </div>
    <div class="filter-row">
      <select id="hist-member"><option value="">전체 팀원</option>${memberOpts}</select>
      <input type="month" id="hist-month" value="${histFilterMonth}"/>
    </div>
    <div id="hist-list">${rows}</div>
  `;
  document.getElementById('hist-member').addEventListener('change', (e)=>{ histFilterMember=e.target.value; renderHistory(); });
  document.getElementById('hist-month').addEventListener('change', (e)=>{ histFilterMonth=e.target.value; renderHistory(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    const target = checkins.find(c=>c.id===b.dataset.del);
    try{
      if(target){
        if(target.wakeupPhotoKey) await window.storage.delete(target.wakeupPhotoKey);
        if(target.activityPhotoKey) await window.storage.delete(target.activityPhotoKey);
      }
    }catch(e){}
    checkins = checkins.filter(c=>c.id!==b.dataset.del);
    await saveCheckins(); toast('기록과 사진을 삭제했어요'); renderAll();
  }));
  document.querySelectorAll('[data-edit-rec]').forEach(b=>b.addEventListener('click', ()=>{
    editingRecordId = (editingRecordId===b.dataset.editRec) ? null : b.dataset.editRec;
    aeWakePhotoNew = null; aeActPhotoNew = null;
    renderHistory();
  }));
  if(adminMode && editingRecordId) bindAdminEditCard();
}

/* ---- 관리자: 과거 날짜의 사진·모닝루틴 체크 수정 ---- */
function renderAdminEditCard(c, member){
  const goals = memberGoals(member);
  const checks = Array.isArray(c.routineChecks) ? c.routineChecks : [null,null];
  const routineRows = goals.map((g,i)=>{
    const ck = checks[i];
    return `<div class="routine-item ${ck&&ck.done?'done':''}">
      <input type="checkbox" class="ae-routine-chk" data-idx="${i}" ${ck&&ck.done?'checked':''}/>
      <span class="routine-goal" style="flex:1;">${g||'(미설정)'}</span>
      <input type="time" class="ae-routine-time" data-idx="${i}" value="${ck&&ck.time?ck.time:''}" style="width:112px;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;font-family:inherit;"/>
    </div>`;
  }).join('');
  return `<div class="cert-card" style="margin:8px 0 14px;border:1.5px solid var(--ink);">
    <div class="cert-head"><span class="step-badge" style="background:var(--ink)">✎ 관리자 수정</span><h4>${member.name} · ${c.date}</h4></div>
    <div class="time-field"><label>기상시간</label><input type="time" id="ae-wake-time" value="${c.wakeupTime&&c.wakeupTime!=='보충'?c.wakeupTime:''}"/></div>
    <div class="photo-box" id="ae-wake-photo">${photoPlaceholderHtml('ae-wake','기상 사진 불러오는 중...','')}</div>
    <input type="file" id="ae-wake-input" accept="image/*" hidden/>
    <div class="section-title" style="margin:14px 0 6px;font-size:16px;">모닝루틴 체크 (시간 직접 수정 가능)</div>
    <div id="ae-routine-list">${routineRows}</div>
    <p class="cert-desc" style="margin-top:12px;">📷 모닝루틴 인증사진 (선택)</p>
    <div class="photo-box" id="ae-act-photo">${photoPlaceholderHtml('ae-act','루틴 사진 불러오는 중...','')}</div>
    <input type="file" id="ae-act-input" accept="image/*" hidden/>
    <div class="form-actions">
      <button class="btn btn-mini ghost" id="ae-cancel">취소</button>
      <button class="btn btn-mini" id="ae-save">저장</button>
    </div>
  </div>`;
}
function bindAdminEditCard(){
  const c = checkins.find(x=>x.id===editingRecordId);
  if(!c) return;
  const member = members.find(m=>m.id===c.memberId);
  if(!member) return;

  const wakeBox = document.getElementById('ae-wake-photo');
  const actBox = document.getElementById('ae-act-photo');
  const wakeInput = document.getElementById('ae-wake-input');
  const actInput = document.getElementById('ae-act-input');

  function showPhoto(box, dataUrl, savedKey, label){
    if(dataUrl){ box.innerHTML = photoPreviewHtml(dataUrl); box.querySelector('.photo-remove').addEventListener('click', ()=>{
      if(box===wakeBox) aeWakePhotoNew=null; else aeActPhotoNew=null;
      loadAndShow();
    }); return; }
    if(savedKey){
      loadPhoto(savedKey).then(url=>{
        if(!url){ box.innerHTML = photoPlaceholderHtml('x', label, '사진 없음 · 탭해서 새로 첨부'); bindPh(); return; }
        box.innerHTML = savedPhotoHtml(url);
        box.querySelector('.photo-preview img').addEventListener('click', ()=> openPhotoOverlay(url));
        box.querySelector('.photo-remove').addEventListener('click', async ()=>{
          try{ await window.storage.delete(savedKey); }catch(e){}
          if(box===wakeBox){ c.wakeupPhotoKey=null; c.wakeupPhoto=false; } else { c.activityPhotoKey=null; c.activityPhoto=false; }
          toast('사진을 삭제했어요'); loadAndShow();
        });
      });
      return;
    }
    box.innerHTML = photoPlaceholderHtml('x', label, '탭해서 사진 첨부');
    bindPh();
    function bindPh(){ box.querySelector('.photo-placeholder')?.addEventListener('click', ()=> (box===wakeBox?wakeInput:actInput).click()); }
  }
  function loadAndShow(){
    showPhoto(wakeBox, aeWakePhotoNew, c.wakeupPhotoKey, '기상 사진');
    showPhoto(actBox, aeActPhotoNew, c.activityPhotoKey, '루틴 사진');
  }
  loadAndShow();

  wakeInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    toast('사진 압축 중...');
    try{ aeWakePhotoNew = await compressImage(file); loadAndShow(); toast('사진을 불러왔어요 · 저장을 눌러 반영하세요'); }
    catch(err){ toast('사진 처리에 실패했어요'); }
  });
  actInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    toast('사진 압축 중...');
    try{ aeActPhotoNew = await compressImage(file); loadAndShow(); toast('사진을 불러왔어요 · 저장을 눌러 반영하세요'); }
    catch(err){ toast('사진 처리에 실패했어요'); }
  });

  document.getElementById('ae-cancel').addEventListener('click', ()=>{
    editingRecordId=null; aeWakePhotoNew=null; aeActPhotoNew=null; renderHistory();
  });
  document.getElementById('ae-save').addEventListener('click', async ()=>{
    const wt = document.getElementById('ae-wake-time').value;
    c.wakeupTime = wt || c.wakeupTime;
    c.held = false;
    if(!Array.isArray(c.routineChecks)) c.routineChecks = [null,null];
    document.querySelectorAll('.ae-routine-chk').forEach(chk=>{
      const i = Number(chk.dataset.idx);
      const timeInput = document.querySelector(`.ae-routine-time[data-idx="${i}"]`);
      const tVal = timeInput ? timeInput.value : '';
      c.routineChecks[i] = chk.checked ? {done:true, time: tVal || (c.routineChecks[i]&&c.routineChecks[i].time) || '00:00'} : null;
    });
    if(aeWakePhotoNew){
      c.wakeupPhotoKey = c.wakeupPhotoKey || ('gt:photo:'+c.id+':wakeup');
      await savePhoto(c.wakeupPhotoKey, aeWakePhotoNew);
      c.wakeupPhoto = true;
    }
    if(aeActPhotoNew){
      c.activityPhotoKey = c.activityPhotoKey || ('gt:photo:'+c.id+':activity');
      await savePhoto(c.activityPhotoKey, aeActPhotoNew);
      c.activityPhoto = true;
    }
    /* 체크/사진을 바탕으로 모닝루틴 인증 시각 재계산 (사진만 있는 경우엔 사진 인증으로 인정) */
    const routineCert = routineCertifiedTime(member, c.date, c.wakeupTime);
    c.activityTime = routineCert || (aeActPhotoNew || c.activityPhoto ? (c.activityTime || nowHM()) : null);
    await saveCheckins();
    editingRecordId=null; aeWakePhotoNew=null; aeActPhotoNew=null;
    toast('수정 내용을 저장했어요 🌱');
    renderAll();
  });
}
function renderAdminPanel(show){
  const panel = document.getElementById('admin-login-panel');
  if(!show){ panel.style.display='none'; panel.innerHTML=''; return; }

  if(!adminMode){
    panel.style.display='block';
    if(currentUserEmail){
      /* 이메일 로그인은 했지만 관리자로 등록된 계정이 아닌 경우 */
      panel.innerHTML = `
        <p style="font-size:17px;color:var(--ink-sub);line-height:1.6;">🔒 <b>${currentUserEmail}</b> 계정은 관리자 권한이 없어요.</p>

      document.getElementById('admin-logout').addEventListener('click', adminLogout);
      return;
    }

      <button class="btn btn-mini" id="admin-login-confirm" style="width:100%;margin-top:10px;">로그인</button>
      <p class="login-error" id="admin-login-error" style="display:none;"></p>`;
    const doAdminLogin = async ()=>{
      const email = document.getElementById('admin-email-input').value.trim();

        await adminLogin(email, pw);

        renderAdminPanel(true);
        renderAll();

        errEl.style.display='block';

    <div class="admin-email-row">
      <span>${em}${em===currentUserEmail?' (나)':''}</span>

    </div>`).join('');

  panel.innerHTML = `
    <div class="section-title" style="margin:0 0 10px;font-size:20.2px;">⚙ 챌린지 설정</div>
    <div class="form-row"><label>챌린지 시작일</label><input type="date" id="set-start" value="${settings.periodStart}"/></div>
    <div class="form-row"><label>챌린지 종료일</label><input type="date" id="set-end" value="${settings.periodEnd}"/></div>
    <div class="form-row"><label>기상 지각 기준 (분)</label><input type="number" id="set-grace" min="0" max="60" value="${settings.graceMin}"/></div>
    <p style="font-size:16.5px;color:var(--ink-faint);margin:-2px 0 12px;">💡 팀원 PIN은 '팀원' 탭에서 각 팀원을 수정해 관리해요</p>
    <div class="form-actions">
      <button class="btn btn-mini ghost" id="set-close" style="flex:1">닫기</button>
      <button class="btn btn-mini" id="set-save" style="flex:1">저장</button>
    </div>

    <div class="section-title" style="margin:16px 0 8px;font-size:18px;">👤 관리자 계정</div>
    <p style="font-size:15.5px;color:var(--ink-faint);margin:-2px 0 10px;">아래 이메일로 로그인한 사람만 관리자 기능을 쓸 수 있어요. 새 관리자를 추가하려면 먼저 Firebase 콘솔에서 그 이메일로 계정을 만들어주세요.</p>
    <div id="admin-email-list">${emailRows}</div>

    <button class="btn btn-mini ghost" id="admin-logout" style="width:100%;margin-top:14px;">🔓 로그아웃</button>

  document.querySelectorAll('[data-rm-admin]').forEach(b=>b.addEventListener('click', async ()=>{
    const target = b.dataset.rmAdmin;
    if(target===currentUserEmail && !confirm('본인 계정을 관리자에서 제외하면 다시 로그인해도 관리자 화면을 볼 수 없어요. 계속할까요?')) return;
    settings.adminEmails = settings.adminEmails.filter(e=>e!==target);
    await saveSettings();
    adminMode = settings.adminEmails.includes(currentUserEmail);
    toast('관리자 계정에서 제외했어요');
    renderAdminPanel(adminMode);
    renderAll();
  }));
  document.getElementById('add-admin-email').addEventListener('click', async ()=>{
    const v = document.getElementById('new-admin-email').value.trim().toLowerCase();
    if(!v || !v.includes('@')){ toast('올바른 이메일을 입력해주세요'); return; }
    if(settings.adminEmails.includes(v)){ toast('이미 등록된 이메일이에요'); return; }
    settings.adminEmails = [...(settings.adminEmails||[]), v];
    await saveSettings();
    toast('관리자로 추가했어요. 그 이메일 계정이 Firebase에도 있어야 로그인할 수 있어요');
    renderAdminPanel(true);
  });
  document.getElementById('set-save').addEventListener('click', async ()=>{
    const s = document.getElementById('set-start').value;
    const e = document.getElementById('set-end').value;
    const g = parseInt(document.getElementById('set-grace').value, 10);
    if(!s || !e || isNaN(g)){ toast('값을 모두 입력해주세요'); return; }
    if(parseDate(s) > parseDate(e)){ toast('시작일이 종료일보다 늦을 수 없어요'); return; }
    settings.periodStart = s; settings.periodEnd = e; settings.graceMin = g;
    await saveSettings();
    calViewDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
    toast('챌린지 설정이 저장됐어요 🌱');
    renderAdminPanel(false);
    renderAll();
  });
}
function bindAdminToggle(){
  document.getElementById('btn-admin-toggle')?.addEventListener('click', ()=>{
    const panel = document.getElementById('admin-login-panel');
    const show = panel.style.display==='none' || panel.style.display==='';
    renderAdminPanel(show);
    if(show) panel.scrollIntoView({behavior:'smooth', block:'center'});
  });
}

/* ===================== Tabs ===================== */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  activeTab = tab;
  document.getElementById('sec-'+activeTab).classList.add('active');
  document.getElementById('hero-card').style.display = (tab==='checkin') ? '' : 'none';
  if(tab==='checkin'){ resetHeroWeekToToday(); renderHero(); }
  if(tab==='calendar'){
    /* 캘린더 탭에 들어올 때마다 핸드폰 기준 이번 달이 보이도록 초기화 */
    calViewDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
    calDetailDate = null;
    renderCalendar();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
});

/* ===================== Boot ===================== */
function renderAll(){
  if(heroWeekIdx===null) heroWeekIdx = currentWeekIndex();
  renderHero(); renderDashboard(); renderCheckin(); renderCalendar(); renderMembers(); renderHistory();
}
/* 재방문 시, 최신 데이터를 기다리는 동안 마지막으로 봤던 화면을 먼저 보여주고
   뒤에서 조용히 최신 데이터로 갱신해요 (첫 방문엔 캐시가 없어서 그냥 평소대로 로딩) */
const LOCAL_CACHE_KEY = 'gt-local-cache-v1';
function tryRenderFromLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(!raw) return false;
    const cached = JSON.parse(raw);
    if(!cached || !cached.members || !cached.checkins || !cached.settings) return false;
    members = cached.members; checkins = cached.checkins; settings = cached.settings;
    calViewDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
    renderAll();
    hideBootSkeleton();
    return true;
  }catch(e){ return false; }
}
function saveLocalCache(){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({members, checkins, settings})); }catch(e){}
}
async function bootApp(){
  try{
    const shownFromCache = tryRenderFromLocalCache();
    await loadData();
    adminMode = !!(currentUserEmail && settings.adminEmails && settings.adminEmails.includes(currentUserEmail));
    renderAll();
    hideBootSkeleton();
    saveLocalCache();
    attachLiveSync();
    if(!firebaseReady){
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:998;background:#FBF1D9;color:#6B4E12;font-size:16px;font-weight:600;text-align:center;padding:10px 14px;border-bottom:1.5px solid #D9B75A;';
      banner.textContent = '⚠️ 아직 Firebase 연결 전이에요 — 지금은 데이터가 새로고침하면 사라져요. 파일 안의 설정 안내를 따라 연결해주세요.';
      document.body.appendChild(banner);
    }
  }catch(e){
    hideBootSkeleton();
    showFatalError('앱 실행 중 오류: ' + e.message + '<br><br><small style="color:#888;">' + (e.stack||'') + '</small>');
  }
}
function hideBootSkeleton(){
  const el = document.getElementById('boot-skeleton');
  if(el){ el.style.transition='opacity .25s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(), 260); }
}
/* 팀원은 로그인 없이 사용해요. 대신 앱이 조용히 '익명 로그인'을 해서
   Firebase 보안 규칙(auth != null)을 만족시켜요 — 화면에는 아무 것도 뜨지 않아요. */
async function ensureAnonymousSession(){
  if(!auth || currentUserEmail) return; // 관리자로 로그인된 상태면 건드리지 않음
  try{ if(!auth.currentUser) await auth.signInAnonymously(); }
  catch(e){ console.error('익명 로그인 실패', e); }
}
/* 관리자 이메일/비밀번호 로그인 (⚙ 패널 안에서만 사용) */
async function adminLogin(email, pw){
  await auth.signInWithEmailAndPassword(email, pw);
  currentUserEmail = email;
  adminMode = !!(settings.adminEmails && settings.adminEmails.includes(email));
}
async function adminLogout(){
  try{ await auth.signOut(); }catch(e){}
  currentUserEmail = null;
  adminMode = false;
  await ensureAnonymousSession();
  renderAdminPanel(false);
  renderAll();
}
(async function init(){
  if(firebaseReady && auth){
    try{ await ensureAnonymousSession(); }catch(e){}
  }
  await bootApp();
})();
</script>
