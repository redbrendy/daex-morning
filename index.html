<style>
  :root{
    --bg:#F3F0F9; --paper:#FFFFFF; --ink:#1E1329; --ink-sub:#665C79; --ink-faint:#A398B5;
    --line:#E6DFF2; --coral:#8A6415; --coral-dim:#F7EAD2; --green:#4A1D73; --green-dim:#EDE3FA;
    --gold:#B8912E; --gold-dim:#FBF1D9; --grey:#867C96; --danger:#9B2C4B;
    --radius:18px; --shadow:0 1px 2px rgba(30,19,41,.05), 0 8px 24px -12px rgba(30,19,41,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; -webkit-font-smoothing:antialiased; display:flex; justify-content:center; overscroll-behavior-y:contain; word-break:keep-all; overflow-wrap:break-word; }
  .device{ width:100%; max-width:430px; min-height:100vh; min-height:100dvh; background:var(--bg); position:relative; padding-bottom:92px; }
  button, a, .tab-btn, .icon-btn, .chip, .wd-pill, .cal-cell, .cal-chip, [role="button"]{ touch-action:manipulation; }

  .app-header{ padding:calc(22px + env(safe-area-inset-top)) 22px 18px; background:linear-gradient(180deg, #EDE6F9 0%, var(--bg) 100%); }
  .header-top{display:flex; align-items:center; justify-content:space-between;}
  /* DAEX 배너 */
  .brand{ position:relative; overflow:hidden; display:flex; align-items:center; gap:12px; background:
      radial-gradient(120% 160% at 12% 0%, #4A2168 0%, rgba(74,33,104,0) 62%),
      linear-gradient(135deg, #33113F 0%, #2A093E 52%, #1E0B30 100%);
    border:1px solid rgba(245,206,74,.34); border-radius:16px; padding:10px 14px 10px 10px; width:100%; box-sizing:border-box;
    box-shadow:0 8px 22px -12px rgba(42,9,62,.65); }
  .brand::before{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.16;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='30' viewBox='0 0 34 30'><path d='M17 1 L33 10 L33 28 L17 37 L1 28 L1 10 Z' fill='none' stroke='%23F5CE4A' stroke-width='1'/></svg>");
    background-size:34px 30px; }
  .brand::after{ content:""; position:absolute; right:-26px; top:-30px; width:110px; height:110px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(245,206,74,.18) 0%, rgba(245,206,74,0) 70%); }
  .brand > *{ position:relative; z-index:1; }
  .brand-mark{ width:48px; height:48px; border-radius:15px; background:#22152F; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 12px rgba(0,0,0,.35); } .brand-mark img{ width:100%; height:100%; object-fit:cover; }
  .brand-name{ font-family:var(--font-display); font-weight:700; font-size:27.8px; letter-spacing:.01em; color:#FFFFFF; text-shadow:0 1px 8px rgba(0,0,0,.35); }
  .brand-sub{font-size:16px; color:#F0DFA6; font-weight:600; margin-top:3px; line-height:1.45;}
  .brand-sub u{ text-decoration-color:rgba(245,206,74,.6); }
  .gear-btn{ width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; color:var(--ink-sub); font-size:21px; }

  .hero-card{ margin-top:18px; background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 24px 22px; }
  .hero-top{display:flex; align-items:flex-end; justify-content:space-between;}
  .hero-day-label{font-size:16.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; cursor:pointer; transition:opacity .1s ease;}
  .hero-day-label:active{opacity:.55;}
  .hero-day{ font-family:var(--font-display); font-weight:600; font-size:51px; line-height:1; margin-top:4px; }
  .hero-day span{color:var(--coral); font-size:24px; margin-left:2px;}
  .hero-period{ text-align:right; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:16.5px; color:var(--ink-sub); }
  .hero-goal-pill{ margin-top:4px; display:inline-block; background:var(--gold-dim); color:#6B5210; font-size:16.5px; font-weight:600; padding:3px 9px; border-radius:99px; }
  .hero-goal-pill.cumulative{ display:block; margin-top:6px; background:var(--green-dim); color:var(--green); }

  .stem-wrap{margin-top:18px; touch-action:pan-y;}
  .week-dots{display:flex; justify-content:center; gap:6px; margin-top:11px;}
  .week-dot{width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .15s ease, transform .15s ease; cursor:pointer;}
  .week-dot.active{background:var(--green); transform:scale(1.3);}
  .stem-labels{display:flex; justify-content:space-between; font-size:17.2px; color:var(--ink-sub); margin-bottom:8px;}
  .hero-member-name{ color:#A8781A; font-weight:900; }
  .stem-labels b{color:var(--ink); font-weight:700;}
  .week-bar-track{height:8px; background:var(--bg); border-radius:99px; overflow:hidden; position:relative;}
  .week-bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,#4A1D73,#7B4BB5); transition:width .3s;}
  .week-days-row{display:flex; justify-content:space-between; gap:5px; margin-top:12px;}
  .wd-pill{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:7px 0 8px; border-radius:11px; background:var(--bg); color:var(--ink-faint); }
  .wd-pill .wd-lbl{font-size:15px; font-weight:600;}
  .wd-pill .wd-mk{font-size:19.5px;}
  .wd-pill.done{background:var(--green-dim); color:var(--green);}
  .wd-pill.done.madeup{opacity:.45;}
  .wd-pill.partial{background:var(--gold-dim); color:#6B5210;}
  .wd-pill.today{outline:1.5px solid var(--coral); color:var(--coral);}
  .wd-pill.weekend{border:1px dashed var(--line);}
  .wd-pill.weekend .wd-lbl{color:var(--ink-faint); font-size:13.5px;}
  .wd-pill.pill-clickable{cursor:pointer;}
  .wd-pill.pill-clickable:active{opacity:.6;}
  .week-hint{font-size:16.5px; color:var(--ink-faint); margin-top:10px; text-align:center; line-height:1.4;}
  .week-hint b{color:var(--green); font-weight:700;}

  .tab-bar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:50; }
  .tab-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-faint); font-family:inherit; font-size:15.8px; padding:6px 2px; border-radius:12px; }
  .tab-btn .ic{font-size:27px; line-height:1;}
  .tab-btn.active{color:var(--green); font-weight:700;}

  .main{padding:0 22px;}
  .section{display:none; padding-top:22px;}
  .section.active{display:block;}

  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .stat-row.three{grid-template-columns:1fr 1fr 1fr;}
  .stat-row.three .stat-card{padding:11px 8px;}
  .stat-card{ background:var(--paper); border-radius:20px; padding:18px 18px; box-shadow:var(--shadow); }
  .stat-card .ic{font-size:24px;}
  .stat-card .lbl{font-size:16.5px; color:var(--ink-sub); margin-top:6px; line-height:1.3;}
  .stat-card .lbl-sub{font-size:13.5px; color:var(--ink-faint);}
  .stat-card .val{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:700; font-size:31.5px; margin-top:2px;}
  .stat-card .val small{font-size:16.5px; font-weight:500; color:var(--ink-faint); margin-left:2px;}

  .section-title{ font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:600; font-size:24.8px; display:flex; align-items:center; gap:7px; margin:30px 0 14px; }
  .section-title .tag{ font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:15px; background:var(--green-dim); color:var(--green); padding:2px 7px; border-radius:6px; font-weight:700; }

  .legend-card{ background:var(--paper); border-radius:20px; padding:20px; box-shadow:var(--shadow); margin-top:16px; }
  .legend-card.two-col{ display:grid; grid-template-columns:1fr 1fr; column-gap:14px; row-gap:0; }
  .legend-card.two-col .legend-row{ border-top:none; padding:7px 0; align-items:flex-start; line-height:1.35; word-break:keep-all; overflow-wrap:break-word; min-width:0; }
  .legend-card.two-col .legend-row .legend-dot{ margin-top:6px; }
  .legend-card.two-col .legend-row > span{ min-width:0; }
  .legend-card .lc-title{font-size:18px; font-weight:700; color:var(--ink-sub); margin-bottom:9px;}
  .legend-row{display:flex; align-items:flex-start; gap:8px; padding:6px 0; font-size:18.8px; border-top:1px dashed var(--line); word-break:keep-all;}
  .legend-row > div:not(.legend-dot){flex:1; min-width:0;}
  .legend-row:first-of-type{border-top:none;}
  .legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:8px;}
  .legend-row b{font-weight:700; margin-right:2px; display:block;}
  .legend-row span.pt{margin-left:auto; flex-shrink:0; padding-left:8px; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:16.5px; color:var(--ink-faint);}

  .rank-card{background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:6px; margin-top:14px;}
  .rank-row{display:flex; align-items:center; gap:11px; padding:10px 8px; border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-num{ font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:600; font-size:22.5px; color:var(--ink-faint); width:28px; text-align:center; }
  .rank-row.r1 .rank-num{color:var(--coral);}
  .avatar{ width:48px; height:48px; border-radius:13px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:21px; flex-shrink:0; }
  .rank-info{flex:1; min-width:0;}
  .rank-name{font-size:20.2px; font-weight:700;}
  .rank-bar-track{height:5px; background:var(--bg); border-radius:99px; margin-top:5px; overflow:hidden;}
  .rank-bar-fill{height:100%; border-radius:99px; background:var(--green);}
  .rank-goal{display:flex; align-items:center; gap:6px; margin-top:5px; font-size:14.5px; color:var(--ink-sub);}
  .rank-goal > span{flex:none;}
  .rank-goal b{flex:none; color:#8A6415; font-weight:700;}
  .rank-bar-track.goal{flex:1; margin-top:0; height:4px; background:var(--gold-dim);}
  .rank-bar-fill.goal{background:linear-gradient(90deg,#E0AE2E,#F5CE4A);}
  .rank-pct{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:700; font-size:21px;}

  .week-rank-card{background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:6px; margin-top:14px;}
  .week-row{display:flex; align-items:center; gap:10px; padding:11px 9px; border-bottom:1px solid var(--line);}
  .week-row:last-child{border-bottom:none;}
  .week-row.current{background:var(--coral-dim); border-radius:10px; border-bottom-color:transparent;}
  .week-tag{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:16.5px; font-weight:700; width:38px; flex-shrink:0;}
  .week-range{font-size:15.8px; color:var(--ink-faint); width:72px; flex-shrink:0;}
  .week-track{flex:1; height:6px; background:var(--bg); border-radius:99px; overflow:hidden;}
  .week-fill{height:100%; border-radius:99px; background:var(--green);}
  .week-row.current .week-track{background:#F7EAD2;}
  .week-row.current .week-fill{background:var(--coral);}
  .week-pct{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:700; font-size:18.8px; width:36px; text-align:right; flex-shrink:0;}

  .month-cumulative-card{ margin-top:14px; background:var(--ink); color:#fff; border-radius:var(--radius); padding:18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); }
  .mc-icon{font-size:39px;}
  .mc-label{font-size:17.2px; color:#C3B9D6;}
  .mc-value{font-family:var(--font-display); font-weight:600; font-size:42px; line-height:1.1; margin-top:2px;}
  .mc-value span{font-size:22.5px; color:#C3B9D6; margin-left:1px;}
  .mc-sub{font-size:15.8px; color:#7C7768; margin-top:4px;}

  .member-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .member-grid-card{display:flex; align-items:center; gap:10px; background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer;}
  .member-grid-card:active{background:var(--green-dim); border-color:var(--green);}
  .member-grid-card .av-sm{width:36px; height:36px; border-radius:11px; font-size:16px; flex-shrink:0;}
  .member-grid-card .nm{font-size:17.2px; font-weight:700; color:var(--ink);}

  .pin-modal-backdrop{position:absolute; inset:0; background:rgba(30,19,41,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:5; border-radius:var(--radius);}
  .pin-modal{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; width:100%; max-width:320px;}
  .pin-modal-desc{font-size:14px; color:var(--ink-sub); margin-top:6px; margin-bottom:14px; line-height:1.5; text-align:center; white-space:nowrap;}
  .pin-modal-actions{display:flex; gap:8px; margin-top:14px;}

  .checkin-form-header{display:flex; align-items:center; margin-top:6px;}
  .checkin-back-btn{height:42px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--paper); color:var(--ink-sub); font-size:16.5px; font-weight:600; font-family:inherit; display:flex; align-items:center; gap:5px;}
  .checkin-who{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .checkin-who .nm{font-size:19.5px; font-weight:700; color:var(--green);}

  .view-photo-box{margin-top:10px; border-radius:12px; overflow:hidden; cursor:pointer; background:var(--bg); min-height:70px; display:flex; align-items:center; justify-content:center;}
  .view-photo-box img{width:100%; max-height:220px; object-fit:cover; display:block;}
  .view-photo-loading{font-size:14px; color:var(--ink-faint); padding:22px;}
  .view-photo-empty{margin-top:10px; padding:10px 12px; border:1.5px dashed var(--line); border-radius:12px; color:var(--ink-faint); font-size:14.5px; text-align:center;}
  .view-routine-list{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .view-routine-row{display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px; background:var(--bg); font-size:16.5px;}
  .view-routine-row.done{background:var(--green-dim);}
  .view-routine-check{font-size:16px; flex-shrink:0;}
  .view-routine-goal{flex:1;}

  .checkin-go-btn{width:100%; display:flex; align-items:center; gap:12px; margin-top:10px; padding:14px 16px; border:none; border-radius:16px; background:var(--green); color:#fff; font-family:inherit; text-align:left; cursor:pointer;}
  .checkin-go-avatar{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:17px; flex-shrink:0; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);}
  .checkin-go-text{display:flex; flex-direction:column; gap:2px;}
  .checkin-go-line1{font-size:16.5px; font-weight:600; color:rgba(255,255,255,.85);}
  .checkin-go-line2{font-size:20px; font-weight:800; color:#fff;}

  .cert-card{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin-top:16px;}
  .cert-head{display:flex; align-items:center; gap:9px;}
  .step-badge{ font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:15px; font-weight:700; color:#fff; background:var(--coral); padding:3px 8px; border-radius:6px; }
  .cert-head h4{font-size:21.8px; font-weight:700;}
  .req{font-size:15px; color:var(--coral); border:1px solid var(--coral); padding:1px 6px; border-radius:99px; margin-left:auto;}
  .opt{font-size:15px; color:var(--ink-faint); border:1px solid var(--line); padding:1px 6px; border-radius:99px; margin-left:auto;}
  .cert-desc{font-size:18px; color:var(--ink-sub); margin-top:6px; line-height:1.5; word-break:keep-all; overflow-wrap:break-word;}
  .cert-desc .li{display:flex; gap:6px; align-items:flex-start;}
  .cert-desc .li > .bt{flex:none;}
  .cert-desc .li > span:last-child{flex:1; min-width:0;}
  .cert-desc .imp{color:#C0392B; font-weight:800;}
  .time-field{ margin-top:12px; display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:10px; padding:10px 12px; gap:10px; }
  .time-field label{font-size:18px; color:var(--ink-sub); flex-shrink:0;}
  .time-field input[type=time]{ font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:700; font-size:24px; border:none; background:none; color:var(--ink); text-align:right; }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:18px; font-weight:700; padding:7px 11px; border-radius:10px; margin-top:12px; }
  .status-pill.perfect{background:var(--green-dim); color:var(--green);}
  .status-pill.wakeup{background:var(--gold-dim); color:#6B5210;}
  .status-pill.goalpart{background:#EFE6FB; color:#5A2C8C;}
  .status-pill.late{background:#F7EAD2; color:#7A5A12;}
  .status-pill.latewake{background:#F0ECF8; color:var(--ink-sub);}
  .status-pill.absent{background:#EDE7F6; color:var(--ink-faint);}
  .status-pill.pending{background:#FBF1D9; color:#7A5A12; border:1px dashed #D9B75A;}
  textarea.memo{ width:100%; margin-top:12px; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:24px; resize:vertical; }
  .routine-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .routine-item{ display:flex; align-items:center; gap:10px; background:#F7F4FC; border:1.5px solid var(--line); border-radius:11px; padding:10px 12px; }
  .routine-item.done{ background:var(--green-dim); border-color:var(--green); }
  .routine-item input[type=checkbox]{ width:24px; height:24px; accent-color:var(--green); flex-shrink:0; }
  .routine-goal{ flex:1; border:none; background:none; font-family:inherit; font-size:17px; font-weight:600; color:var(--ink); min-width:0; }
  .routine-goal:focus{ outline:none; }
  .routine-item.done .routine-goal{ text-decoration:line-through; color:var(--ink-sub); }
  .routine-time{ flex-shrink:0; font-size:15px; font-weight:700; color:var(--green); background:#fff; border-radius:99px; padding:2px 9px; }
  .routine-status{ margin-top:10px; display:flex; flex-direction:column; gap:5px; font-size:16px; font-weight:600; }
  .rt-ok{ color:var(--green); }
  .rt-wait{ color:var(--ink-faint); }
  .rt-locked{ color:#7A5A12; }
  .rt-rate{ display:block; color:var(--green); font-weight:700; margin-bottom:4px; }
  .photo-box{ margin-top:12px; }
  .photo-placeholder{ border:1.5px dashed var(--line); border-radius:20px; padding:30px 16px; text-align:center; background:var(--bg); cursor:pointer; }
  .photo-placeholder .ic{font-size:30px; display:block; margin-bottom:6px;}
  .photo-placeholder p{font-size:18.8px; color:var(--ink-sub); font-weight:600;}
  .photo-placeholder span{font-size:15.8px; color:var(--ink-faint);}
  .photo-preview{ position:relative; border-radius:14px; overflow:hidden; background:#1E1329; }
  .photo-preview img{ width:100%; max-height:420px; min-height:180px; object-fit:contain; display:block; }
  .photo-remove{ position:absolute; top:8px; right:8px; width:36px; height:36px; border-radius:50%; border:none; background:rgba(28,43,32,.7); color:#fff; font-size:19.5px; cursor:pointer; }
  .saved-tag{ position:absolute; bottom:8px; left:8px; background:rgba(47,107,79,.85); color:#fff; font-size:14px; font-weight:700; padding:4px 10px; border-radius:99px; pointer-events:none; }
  .photo-note{ font-size:15.8px; color:var(--ink-faint); text-align:center; margin-top:10px; line-height:1.5; }
  .photo-viewer-overlay{ position:fixed; inset:0; background:rgba(10,15,10,.9); z-index:999; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-input{ width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:12px; font-family:inherit; font-size:16px; margin-top:10px; }
  .login-error{ color:#9B2C4B; font-size:14.5px; margin-top:10px; }
  .photo-viewer-overlay img{ max-width:100%; max-height:100%; border-radius:14px; display:block; }
  .photo-viewer-close{ position:absolute; top:calc(16px + env(safe-area-inset-top)); right:16px; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff; font-size:18px; }
  .view-photo-btn{ background:none; border:none; padding:0; font-size:inherit; color:var(--green); font-weight:700; text-decoration:underline; cursor:pointer; }
  .verified-tag{ color:var(--green); font-weight:700; }
  .unverified-btn{ background:#EDE7F6; border:1px solid var(--line); border-radius:99px; padding:3px 12px; font-family:inherit; font-size:15.5px; font-weight:700; color:var(--ink-faint); cursor:pointer; }
  .unverified-tag{ background:#EDE7F6; border:1px solid var(--line); border-radius:99px; padding:3px 12px; font-size:15.5px; font-weight:700; color:var(--ink-faint); display:inline-block; }
  .hold-card{padding:13px 16px;}
  .makeup-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .makeup-item{ display:flex; align-items:center; gap:10px; font-size:18px; font-weight:600; cursor:pointer; }
  .makeup-item input[type=checkbox]{ width:22px; height:22px; accent-color:var(--coral); flex-shrink:0; }
  .hold-row{display:flex; align-items:flex-start; gap:10px; cursor:pointer;}
  .hold-row input[type=checkbox]{width:19px; height:19px; margin-top:2px; accent-color:var(--coral); flex-shrink:0;}
  .hold-row b{font-size:19.5px;}
  .hold-sub{font-size:16.5px; color:var(--ink-sub); line-height:1.5;}

  .pin-row{display:flex; gap:8px; align-items:center; margin-top:6px;}
  .pin-input{flex:0 0 50%; max-width:50%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:24px; letter-spacing:6px; text-align:center;}
  .btn{font-family:inherit; border:none; cursor:pointer;}
  .btn-mini{padding:11px 16px; border-radius:10px; background:var(--green); color:#fff; font-weight:700; font-size:18.8px; flex-shrink:0;}
  .btn-mini.ghost{background:var(--paper); border:1px solid var(--line); color:var(--ink-sub);}
  .btn-mini.danger{background:var(--danger); color:#fff;}
  .pin-error{font-size:17.2px; color:var(--danger); margin-top:6px; display:none;}
  .lock-note{font-size:18px; color:var(--ink-faint); margin-top:10px; display:flex; align-items:center; gap:6px;}
  .disabled-area{opacity:.4; pointer-events:none;}

  .submit-btn{ width:100%; margin-top:18px; padding:14px; border:none; border-radius:14px; background:var(--green); color:#fff; font-weight:700; font-size:21.8px; font-family:inherit; }
  .submit-btn:disabled{background:#D5CCE6;}
  /* 오늘인증 화면에서만 쓰는, 스크롤해도 항상 보이는 저장 버튼 바 (탭바 바로 위에 떠있음) */
  .checkin-submit-bar{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(72px + env(safe-area-inset-bottom)); width:100%; max-width:430px; padding:0 22px; z-index:45; }
  .checkin-submit-bar .submit-btn{ margin-top:0; box-shadow:var(--shadow); }
  .checkin-bottom-spacer{ height:70px; }

  .cal-chip-row{display:flex; gap:8px; align-items:center; margin-top:10px;}
  .cal-chip{ flex-shrink:0; font-size:17.2px; font-weight:600; padding:6px 12px; border-radius:99px; background:var(--paper); border:1px solid var(--line); color:var(--ink-sub); }
  .cal-chip.active{background:var(--green); border-color:var(--green); color:#fff;}
  .cal-chip-more{flex:1 1 0; display:flex; align-items:center; justify-content:center; gap:5px; font-size:15.5px; font-weight:600; padding:8px 10px; border-radius:99px; background:var(--paper); border:1px solid var(--line); color:var(--ink-sub); font-family:inherit; cursor:pointer; white-space:nowrap;}
  .cal-chip-more-arrow{font-size:12px;}
  .cal-member-dropdown{margin-top:8px; border:1px solid var(--line); border-radius:14px; padding:8px; max-height:260px; overflow-y:auto; background:var(--paper);}
  .cal-dropdown-label{font-size:14px; color:var(--ink-faint); padding:4px 8px 8px;}
  .cal-dropdown-row{display:flex; justify-content:space-between; align-items:center; padding:9px 10px; border-radius:10px; cursor:pointer; font-size:16.5px;}
  .cal-dropdown-row.active{background:var(--green-dim); color:var(--green); font-weight:700;}
  .cal-dropdown-pct{font-size:14px; color:var(--coral);}
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-top:16px;}
  .cal-nav-title{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-weight:600; font-size:23.2px;}
  .cal-nav button{width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--paper); color:var(--ink-sub); font-size:15px;}
  .cal-card{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-top:10px;}
  .cal-card-wrap{position:relative; touch-action:pan-y;}
  .cal-swipe-arrow{position:absolute; top:50%; transform:translateY(-50%); font-size:22px; color:var(--ink-faint); opacity:.45; pointer-events:none; z-index:1;}
  .cal-swipe-arrow.left{left:2px;}
  .cal-swipe-arrow.right{right:2px;}
  .cal-wd-row{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:15.8px; color:var(--ink-faint); margin-bottom:6px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-cell{aspect-ratio:1; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:17.2px; background:#F7F4FC; color:var(--ink-faint); cursor:pointer; transition:transform .1s ease, box-shadow .15s ease; transform:scale(1);}
  .cal-cell:active{transform:scale(0.86);}
  .cal-cell.selected{ box-shadow:0 0 0 2.5px var(--ink) inset, inset 0 0 0 999px rgba(255,255,255,.6); font-weight:800; }
  .cal-cell .leaf{font-size:15px; margin-top:2px;}
  .cal-cell.other-month{background:#F7F4FC; color:rgba(28,43,32,.22); font-weight:400; border:1px dashed var(--line);}
  .cal-cell.other-month.perfect{background:#EDE3FA; color:rgba(47,107,79,.35); border:1px dashed var(--green); font-weight:700;}
  .cal-cell.weekend{ background:#F1ECF9; }
  .cal-cell.perfect{background:linear-gradient(135deg,#4A1D73,#7B4BB5); color:#fff; font-weight:700;}
  .cal-cell.goalpart{background:#C6A9E8; color:#33124F; font-weight:700;}
  .cal-cell.wakeup{background:var(--gold); color:#4A3508; font-weight:700;}   /* ⏰ 기상성공만 */
  .cal-cell.late{background:#E7CB86; color:#5E4406; font-weight:700;}        /* 🎯 목표인증만 */
  .cal-cell.latewake{background:#E9E2F4; color:var(--ink-sub); font-weight:700;}
  .cal-cell.absent{background:#fff; border:1px solid var(--line); color:var(--ink-faint);}
  .cal-cell.today{outline:2px solid var(--coral); outline-offset:-2px;}
  .cal-cell.partial{background:var(--gold-dim); color:#6B5210; font-weight:700;}
  .cal-cell.pending{background:#FBF1D9; color:#7A5A12; border:1px dashed #D9B75A; font-weight:700;}
  /* 주말대체인증으로 채운 평일 = 성공 배경이되 흐리게 */
  .cal-cell.madeup{background:linear-gradient(135deg,#4A1D73,#7B4BB5); color:#fff; font-weight:700; opacity:.34;}
  .cal-cell.madeup-late{background:linear-gradient(135deg,#4A1D73,#7B4BB5); color:#fff; font-weight:700; opacity:.28;}
  .cal-detail{background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:14px; margin-top:10px;}
  .cal-history{max-height:420px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .cal-detail-row{display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px dashed var(--line);}
  .cal-detail-row:first-child{border-top:none;}

  .member-card{ display:flex; align-items:center; gap:12px; background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:13px; margin-top:10px; }
  .member-card .av-lg{width:58px; height:58px; border-radius:15px; font-size:24px;}
  .member-card .mname{font-size:21px; font-weight:700;}
  .member-card .mgoal{font-size:17.2px; color:var(--ink-sub); margin-top:2px;}
  .member-card .mtime{margin-left:8px; text-align:right; font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:19.5px; font-weight:700; color:var(--green); flex-shrink:0;}
  .member-card .mactions{display:flex; gap:6px; margin-left:auto; flex-shrink:0;}
  .name-toggle{ margin-left:auto; font-family:inherit; font-size:16.5px; font-weight:600; color:var(--green);
    background:var(--green-dim); border:1.5px solid var(--green); border-radius:99px; padding:6px 12px; max-width:52%; }
  .icon-btn{width:42px; height:42px; border-radius:11px; border:1px solid var(--line); background:var(--paper); color:var(--ink-sub); font-size:18px;}

  .admin-banner{background:var(--paper); border:1px dashed var(--line); border-radius:14px; padding:16px; text-align:center; color:var(--ink-sub); font-size:18.8px;}
  .admin-banner .ic{font-size:30px; display:block; margin-bottom:6px;}
  .form-card{background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:14px; margin-top:10px;}
  .form-row{margin-bottom:10px;}
  .form-row label{font-size:17.2px; color:var(--ink-sub); display:block; margin-bottom:5px; font-weight:600;}
  .form-row input{width:100%; padding:10px 11px; border:1.5px solid var(--line); border-radius:9px; font-family:inherit; font-size:24px;}
  .color-row{display:flex; gap:7px; flex-wrap:wrap; margin-top:4px;}
  .color-dot{width:25px; height:25px; border-radius:8px; cursor:pointer; border:2px solid transparent;}
  .color-dot.sel{border-color:var(--ink);}
  .form-actions{display:flex; gap:8px; margin-top:12px;}
  .admin-email-row{display:flex; align-items:center; justify-content:space-between; background:#F7F4FC; border:1px solid var(--line); border-radius:9px; padding:8px 12px; margin-bottom:6px; font-size:15.5px;}
  .form-actions .btn-mini{flex:1; text-align:center;}

  .filter-row{display:flex; gap:8px; margin-top:10px;}
  .filter-row select, .filter-row input{flex:1; padding:9px 10px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:24px; background:var(--paper);}

  .hist-row{ background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:13px; margin-top:10px; display:flex; gap:11px; align-items:flex-start; }
  .hist-row .av-sm2{width:40px; height:40px; border-radius:11px; font-size:18px; flex-shrink:0;}
  .hist-top{display:flex; align-items:center; gap:7px;}
  .hist-name{font-size:19.5px; font-weight:700;}
  .hist-date{font-size:16.5px; color:var(--ink-faint); font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; margin-left:auto;}
  .hist-badge{font-size:15px; font-weight:700; padding:2px 7px; border-radius:99px; margin-top:5px; display:inline-block;}
  .hist-memo{font-size:18px; color:var(--ink-sub); margin-top:5px; line-height:1.5;}
  .hist-del{margin-left:6px;}

  .empty-state{text-align:center; padding:30px 10px; color:var(--ink-faint); font-size:18.8px;}
  .empty-state .ic{font-size:36px; display:block; margin-bottom:8px;}

  .toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:99px; font-size:18.8px; z-index:90; box-shadow:var(--shadow); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .shared-note{font-size:15.8px; color:var(--ink-faint); text-align:center; margin-top:18px; line-height:1.5;}
  .admin-login-panel{ margin-top:12px; background:var(--paper); border-radius:14px; box-shadow:var(--shadow); padding:14px; }
  .admin-login-panel .pin-row{margin-top:8px;}
</style>
</head>

/* ===================== Date helpers ===================== */
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function startOfWeek(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const dow=x.getDay(); const diff=(dow===0?6:dow-1); x.setDate(x.getDate()-diff); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDate(a,b){ return fmtDate(a)===fmtDate(b); }
function todayStr(){ return fmtDate(todayDate); }
function isPast(d){ return d < new Date(todayDate.getFullYear(),todayDate.getMonth(),todayDate.getDate()); }
function isFuture(d){ return d > new Date(todayDate.getFullYear(),todayDate.getMonth(),todayDate.getDate()); }

};

/* Firebase가 설정됐으면 온라인 공유 창고를, 아니면 임시 메모리 창고를 사용 */
const firebaseReady = (typeof firebase !== 'undefined') && firebaseConfig.apiKey !== "수정";

function showFatalError(msg){
  document.body.innerHTML = `<div style="font-family:sans-serif;padding:32px;max-width:500px;margin:auto;">
    <h2 style="color:#9B2C4B;">⚠️ 오류가 발생했어요</h2>
    <p style="background:#FAEEF2;border:1px solid #EED5DD;border-radius:8px;padding:16px;font-size:15px;line-height:1.7;">${msg}</p>
    <p style="font-size:14px;color:#555;">위 오류 내용을 그대로 복사해서 알려주시면 바로 해결해드릴게요.</p>
  </div>`;
}
function keyToPath(key){ return 'growtime/' + key.replace(/[.#$\[\]\/]/g, '_'); }
const memoryStore = {}; // Firebase 미설정 시 임시 저장 (새로고침하면 사라짐)
window.storage = {
  async get(key){
    if(fdb){ const snap = await fdb.ref(keyToPath(key)).get(); return snap.exists() ? {key, value: snap.val()} : null; }
    return (key in memoryStore) ? {key, value: memoryStore[key]} : null;
  },
  async set(key, value){
    if(fdb){ await fdb.ref(keyToPath(key)).set(value); return {key, value}; }
    memoryStore[key] = value; return {key, value};
  },
  async delete(key){
    if(fdb){ await fdb.ref(keyToPath(key)).remove(); return {key, deleted:true}; }
    delete memoryStore[key]; return {key, deleted:true};
  }
};

/* 다른 사람이 인증을 올리면 내 화면도 자동으로 갱신되는 실시간 동기화 */
function attachLiveSync(){
  if(!fdb) return;
  const watch = [
    ['gt:members',  v=>{ members  = JSON.parse(v); }],
    ['gt:checkins', v=>{ checkins = JSON.parse(v); }],
    ['gt:settings', v=>{ settings = JSON.parse(v); }]
  ];
  watch.forEach(([key, apply])=>{
    fdb.ref(keyToPath(key)).on('value', snap=>{
      if(!snap.exists()) return;
      const incoming = snap.val();
      const current = key==='gt:members' ? JSON.stringify(members)
                    : key==='gt:checkins' ? JSON.stringify(checkins)
                    : JSON.stringify(settings);
      if(incoming === current) return; // 내가 방금 저장한 것과 같으면 무시
      try{ apply(incoming); renderAll(); }catch(e){ console.error(e); }
    });
  });
}

/* Resize + re-encode as JPEG so uploaded camera photos (often 3-8MB) shrink to a couple hundred KB. */
function compressImage(file, maxDim=1024, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('이미지를 읽을 수 없어요'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('파일을 읽을 수 없어요'));
    reader.readAsDataURL(file);
  });
}

/* ===================== Domain logic ===================== */
function timeToMinutes(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function isOnTime(member, actualTime){
  const target = timeToMinutes(member.targetTime), actual = timeToMinutes(actualTime);
  if(target==null||actual==null) return false;
  return actual <= target + (settings.graceMin);
}
function getCheckin(memberId, dateStr){ return checkins.find(c=>c.memberId===memberId && c.date===dateStr); }
function hasCheckin(memberId, dateStr){ const c=getCheckin(memberId,dateStr); return !!(c && c.wakeupTime && !c.held); }

function sundayNoonOf(weekStart){ const e=addDays(weekStart,6); return new Date(e.getFullYear(),e.getMonth(),e.getDate(),12,0,0); }
/* 한 주 안에서 '주말대체인증을 체크한' 평일 목록과 주말 인증 수를 구한다.
   체크하지 않고 놓친 날은 주말 만회 대상이 아니며 즉시 결석(-100)으로 확정된다. */
function weekMissedInfo(memberId, weekStart){
  const member = members.find(m=>m.id===memberId);
  const heldMissed=[], plainMissed=[]; let weekendChecked=0;
  for(let i=0;i<7;i++){
    const d=addDays(weekStart,i); const ds=fmtDate(d);
    if(member && isOutsideMission(member, ds)) continue; /* 미션 시작 전·등록 전·제외기간은 세지 않음 */
    if(isWeekend(d)){ if(hasCheckin(memberId,ds)) weekendChecked++; continue; }
    if(!hasCheckin(memberId,ds)){
      const c = getCheckin(memberId, ds);
      if(c && c.held) heldMissed.push(ds); /* 당일 체크한 날은 우선 만회 (-5) */
      else if(isPast(d)) plainMissed.push(ds); /* 체크 없이 놓친 과거 평일도 만회 가능 (-70, 남는 슬롯이 있을 때만) */
    }
  }
  const missed = heldMissed.concat(plainMissed);
  return {missed, weekendChecked, heldSet: new Set(heldMissed)};
}
/* 미션 범위 밖 날짜 판별: 관리자가 정한 시작일 이전·종료일 이후, (늦게 합류한 팀원의) 등록일 이전,
   인증제외기간은 성공도 실패도 아닌 '해당 없음'으로 취급해 캘린더·성공률 어디에도 나타나지 않아요 */
function isOutsideMission(member, dateStr){
  if(dateStr < settings.periodStart || dateStr > settings.periodEnd) return true;
  if(isBeforeRegistration(member, dateStr)) return true;
  if(isExemptDay(member, dateStr)) return true;
  return false;
}
/* 내부 점수(100 기준)를 화면 표시용 10점 만점 기준으로 변환 (예: -50 → -5, -5 → -0.5) */
function fmtScore10(s){
  const v = s / 10;
  const str = Number.isInteger(v) ? String(v) : v.toFixed(1);
  return v > 0 ? '+' + str : str;
}
function dayStatus(member, dateStr){
  if(isOutsideMission(member, dateStr)) return {code:'none', label:'', score:0, leaf:''};
  const c = getCheckin(member.id, dateStr);
  const d0 = parseDate(dateStr);
  const isToday = dateStr === todayStr();
  if(c && c.held && !isPast(d0)) return {code:'pending', label:'⏳ 주말대체인증', score:0, leaf:'⏳'};
  if(!c || !c.wakeupTime || c.held || c.wakeupTime==='보충'){
    const d = d0;
    /* ⭐ 수정된 부분: 주말(토·일)이고 그날 인증이 없으면
       '해당없음'으로 처리해서 캘린더에 표시되지 않게 함 */
    if(isWeekend(d)) return {code:'none', label:'', score:0, leaf:''};
    const ws = startOfWeek(d);
    const info = weekMissedInfo(member.id, ws);
    const idx = info.missed.indexOf(dateStr);
    const wasHeld = info.heldSet.has(dateStr);
    /* ⭐ 오늘 당일 미인증은 아직 하루가 끝나지 않았으므로 문구만 다르게 (이모지는 둘 다 없음)
       다른 미인증과 같은 흰 배경으로만 표시하고 이모지는 붙이지 않음 */
    if(idx >= 2) return isToday
      ? {code:'absent', label:'오늘 미인증', score:-100, leaf:''}
      : {code:'absent', label:'미인증', score:-100, leaf:''};
    if(idx >= 0 && info.weekendChecked > idx){
      if(wasHeld) return {code:'madeup', label:'😆 미리 체크한 대체인증', score:-10, leaf:'😆'};
      return {code:'madeup-late', label:'🔁 뒤늦게 채운 대체인증(주말)', score:-70, leaf:'🔁'};
    }
    if(idx >= 0 && new Date() < sundayNoonOf(ws)){
      if(wasHeld) return {code:'pending', label:'⏳ 주말대체인증', score:0, leaf:'⏳'};
      return isToday
        ? {code:'absent', label:'오늘 미인증', score:-100, leaf:''}
        : {code:'absent', label:'미인증 (주말 만회 가능)', score:-100, leaf:''};
    }
    return isToday
      ? {code:'absent', label:'오늘 미인증', score:-100, leaf:''}
      : {code:'absent', label:'미인증', score:-100, leaf:''};
  }
  /* ⭐ 주말에 실제로 체크인(진짜 대체인증)했고, 그 주에 만회할 평일 결석이 있었다면
     평소 성공 이모지 대신 '뒤늦게 채운 대체인증(주말)'로 표시함 */
  if(isWeekend(d0)){
    const ws2 = startOfWeek(d0);
    const info2 = weekMissedInfo(member.id, ws2);
    if(info2.missed.length > 0){
      return {code:'madeup-late', label:'🔁 뒤늦게 채운 대체인증(주말)', score:-70, leaf:'🔁'};
    }
  }
  const onTime = isOnTime(member, c.wakeupTime);
  const hasAct = !!c.activityTime;
  if(!hasAct && dateStr === todayStr()){
    const win = routineWindow(c.wakeupTime, member.targetTime);
    if(win!=null && minutesNow_() <= win.max){
      return {code:'pending', label:'⏳ 모닝루틴 인증 대기 (기상 후 30~60분에 체크)', score:0, leaf:'⏳'};
    }
  }
  const gp = goalProgress(member, dateStr, c.wakeupTime);
  if(onTime && hasAct){
    if(gp.rate >= 1) return {code:'perfect', label:'😆 덱스모닝성공 (기상+목표)', score:0, leaf:'😆'};
    /* 목표 달성률형: 기상은 성공했지만 적어둔 목표를 다 못 채우면 못 채운 만큼만 차감 */
    return {code:'goalpart', label:`🙂 기상성공 · 목표 ${gp.done}/${gp.total} 달성`, score:-Math.round(50*(1-gp.rate)), leaf:'🙂'};
  }
  if(onTime && !hasAct) return {code:'wakeup', label:'⏰ 기상성공 (목표 미인증)', score:-50, leaf:'⏰'};
  if(!onTime && hasAct){
    if(gp.rate >= 1) return {code:'late', label:'🎯 목표인증 (기상 실패)', score:-40, leaf:'🎯'};
    return {code:'late', label:`🎯 목표인증 ${gp.done}/${gp.total} (기상 실패)`, score:-Math.round(50-10*gp.rate), leaf:'🎯'};
  }
  return {code:'latewake', label:'기상·목표 모두 실패', score:-50, leaf:''};
}

function getWeeksOfMonth(year, monthIdx){
  const first=new Date(year,monthIdx,1), last=new Date(year,monthIdx+1,0);
  const weeks=[]; let cur=startOfWeek(first);
  while(cur<=last){ weeks.push({start:new Date(cur), end:addDays(cur,6)}); cur=addDays(cur,7); }
  return weeks;
}
function periodStartDate(){ return parseDate(settings.periodStart); }
function periodEndDate(){ return parseDate(settings.periodEnd); }
function periodWeeks(){
  const start = periodStartDate(), end = periodEndDate();
  const weeks=[]; let cur=startOfWeek(start);
  const lastWeekStart = startOfWeek(end);
  while(cur<=lastWeekStart){ weeks.push({start:new Date(cur), end:addDays(cur,6)}); cur=addDays(cur,7); }
  return weeks;
}
function isWeekend(d){ const dow=d.getDay(); return dow===0 || dow===6; }
function weekDaysChecked(memberId, week){
  let weekdayCount=0, weekendCount=0;
  for(let i=0;i<7;i++){
    const d=addDays(week.start,i);
    if(isFuture(d)) continue;
    const checked = hasCheckin(memberId, fmtDate(d));
    if(!checked) continue;
    if(isWeekend(d)) weekendCount++; else weekdayCount++;
  }
  const deficit = Math.max(0, 5-weekdayCount);     // 평일 중 못 채운 날 수
  const makeupUsed = Math.min(weekendCount, deficit, 2); // 주말 인증으로 메꾼 날 수 (최대 2일)
  return weekdayCount + makeupUsed; // 0~5
}
function weekPendingCount(memberId, week){
  // 주말 보충으로도 아직 못 채운, 평일 중 인증 못한 날 수 (보류 중)
  let weekdayCount=0, weekendCount=0, weekdayMissedPast=0;
  for(let i=0;i<7;i++){
    const d=addDays(week.start,i);
    if(isFuture(d)) continue;
    const checked = hasCheckin(memberId, fmtDate(d));
    if(isWeekend(d)){ if(checked) weekendCount++; }
    else { if(checked) weekdayCount++; else weekdayMissedPast++; }
  }
  const deficit = Math.max(0, 5-weekdayCount);
  const makeupUsed = Math.min(weekendCount, deficit, 2);
  return Math.max(0, weekdayMissedPast - makeupUsed);
}
function weekRate(memberId, week){ return Math.min(weekDaysChecked(memberId,week),5)/5*100; }
function teamWeekRate(week){
  if(members.length===0) return 0;
  return Math.round(members.reduce((s,m)=>s+weekRate(m.id,week),0)/members.length);
}
/* 확정된 결석 일수: 3일째 이상 결석(즉시 확정) + 일요일 정오까지 보충 못한 보류 */
function memberDefiniteAbsences(memberId){
  const now = new Date(); let total = 0;
  periodWeeks().forEach(w=>{
    if(w.start > todayDate) return;
    const info = weekMissedInfo(memberId, w.start);
    info.missed.forEach((ds, idx)=>{
      if(idx >= 2){ total++; return; }          // 주중 3일째부터는 즉시 결석 확정
      if(info.weekendChecked > idx) return;      // 주말 보충으로 채워짐
      if(now >= sundayNoonOf(w.start)) total++;  // 마감 지나면 결석 확정
    });
  });
  return total;
}
/* 인증제외기간(휴가·병가 등) 판별: 이 기간의 날짜는 누적성공률 계산에서 완전히 빠져요 */
function isExemptDay(member, dateStr){
  if(!member.exemptStart || !member.exemptEnd) return false;
  return dateStr >= member.exemptStart && dateStr <= member.exemptEnd;
}
/* 팀원등록일 이전 날짜 판별: 나중에 합류한 팀원은 등록일 이전 날짜가 누적성공률 계산에서 빠져요
   (등록일 정보가 없는 예전 팀원은 기존과 동일하게 미션 시작일부터 전부 반영) */
function isBeforeRegistration(member, dateStr){
  return !!member.registeredAt && dateStr < member.registeredAt;
}
/* 누적성공률 = 100%에서 시작, 미션기간(또는 팀원등록일~목표종료일) 전체 평일 수를 기준으로 인증 결과만큼만 차감
   (덱스모닝성공 0, 기상성공만 -50, 목표인증만 -40~-45, 기상·목표 모두 실패 -50,
    미리 체크한 대체인증 -10, 뒤늦게 채운 대체인증(주말) -70, 미인증(결석) -100)
   → 100% 기준 = 월~금 기상+루틴 인증을 목표기간 내내 완료
   → 120% 기준 = 100% 기준 + 주말도 전부 인증 (평일:주말 = 5:2 비율이므로 주말 인증 1건당 50점을 더해야
      전체 주말을 다 채웠을 때 정확히 +20%p가 되어 120%에 닿는다)
   인증제외기간 및 등록일 이전 날짜는 분모(필수일수)·분자(차감) 모두에서 빠져요 */
const WEEKEND_BONUS = 50;
/* 그 주 5일(월~금)이 전부 완전 성공(0점)인지 확인 — 자진신청 만회(-5점)는 감점이 있으므로 보너스 대상에서 제외됨.
   아직 결과가 안 정해진(pending) 날이 있으면 판단 보류(null) */
function weekWeekdayAllZero(memberId, weekStart){
  const member = members.find(m=>m.id===memberId);
  for(let i=0;i<5;i++){
    const d = addDays(weekStart, i);
    if(isFuture(d) || d > todayDate) continue;
    const ds = fmtDate(d);
    if(member && isOutsideMission(member, ds)) continue;
    if(sameDate(d, todayDate) && !getCheckin(memberId, ds)) continue;
    const st = dayStatus(member, ds);
    if(st.code==='pending') return false;
    if(st.score !== 0) return false;
  }
  return true;
}
/* month를 넘기면 그 달({year, monthIdx})에 속한 평일만 계산해요 (캘린더 탭의 월별 성공률).
   생략하면 미션기간 전체 기준입니다. */
function inMonthOf(ds, month){
  if(!month) return true;
  return Number(ds.slice(0,4))===month.year && Number(ds.slice(5,7))===month.monthIdx+1;
}
/* 그 달에 미션 대상 평일이 하나라도 있는지 (없으면 성공률을 '–'로 표시) */
function hasMissionDaysInMonth(member, month){
  const last = new Date(month.year, month.monthIdx+1, 0).getDate();
  for(let day=1; day<=last; day++){
    const d = new Date(month.year, month.monthIdx, day);
    if(isWeekend(d)) continue;
    if(!isOutsideMission(member, fmtDate(d))) return true;
  }
  return false;
}
function memberCumulativeRate(memberId, month){
  const member = members.find(m=>m.id===memberId);
  if(!member) return 100;
  let totalRequired = 0;
  periodWeeks().forEach(w=>{
    for(let i=0;i<5;i++){
      const d = addDays(w.start, i);
      const ds1 = fmtDate(d);
      if(!inMonthOf(ds1, month)) continue;
      if(!isOutsideMission(member, ds1)) totalRequired++;
    }
  });
  if(totalRequired === 0) return 100;
  let totalDeduction = 0;
  periodWeeks().forEach(w=>{
    if(w.start > todayDate) return;
    for(let i=0;i<5;i++){  // 월~금만
      const d = addDays(w.start, i);
      if(isFuture(d) || d > todayDate) continue;
      const ds2 = fmtDate(d);
      if(!inMonthOf(ds2, month)) continue;
      if(isOutsideMission(member, ds2)) continue; // 시작일 이전·등록일 이전·제외기간은 건너뜀
      /* 당일 반영: 오늘 아직 인증(또는 주말대체인증 체크)이 없으면 즉시 결석으로 계산되고,
         인증하거나 체크하는 순간 바로 회복돼요 */
      const st = dayStatus(member, ds2);
      if(st.code==='pending') continue; // 아직 결과가 정해지지 않은 보류일은 계산에서 제외
      totalDeduction += st.score;
    }
    /* 그 주 금요일까지 지났고, 평일 5일이 전부 완전 성공(0점)이라면 주말 추가 인증에 보너스 (자진신청 만회는 -5점이라 보너스 대상 아님) */
    const friday = addDays(w.start,4);
    if(friday <= todayDate){
      if(weekWeekdayAllZero(memberId, w.start)){
        for(let i=5;i<7;i++){
          const d = addDays(w.start,i);
          if(d > todayDate) continue;
          if(!inMonthOf(fmtDate(d), month)) continue;
          if(hasCheckin(memberId, fmtDate(d))) totalDeduction += WEEKEND_BONUS;
        }
      }
    }
  });
  return Math.max(0, Math.min(120, Math.round(100 + totalDeduction / totalRequired)));
}
function monthWeeksFor(year,monthIdx){ return getWeeksOfMonth(year,monthIdx); }
function currentWeekIndex(){
  const weeks = periodWeeks();
  if(weeks.length===0) return 0;
  /* 시:분:초를 빼고 '날짜'만으로 비교해야 해요. 그렇지 않으면 각 주의 마지막 날(일요일)
     자정(00:00)이 지난 시각에는 어느 주에도 안 걸쳐서 엉뚱하게 마지막 주로 튕기는 버그가 생겨요. */
  const today0 = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());
  for(let i=0;i<weeks.length;i++){ if(today0>=weeks[i].start && today0<=weeks[i].end) return i; }
  if(today0 < weeks[0].start) return 0;
  return weeks.length-1;
}
function elapsedDaysOfPeriod(){
  const start = periodStartDate(), end = periodEndDate();
  const endClamped = todayDate<end? todayDate : end;
  if(endClamped<start) return [];
  const arr=[]; let d=new Date(start);
  while(d<=endClamped){ arr.push(fmtDate(d)); d=addDays(d,1); }
  return arr;
}
function memberPointAvg(memberId){
  const days = elapsedDaysOfPeriod();
  if(days.length===0) return 0;
  const member = members.find(m=>m.id===memberId);
  const total = days.reduce((s,d)=>s+dayStatus(member,d).score,0);
  return Math.round(total/days.length);
}
/* 오늘 현황 집계
   세 항목은 서로 겹치지 않아요 (한 사람은 셋 중 한 곳에만 들어갑니다)
   - grow        : 😆 덱스모닝성공 = 기상성공 + 목표인증을 둘 다 해낸 사람
   - wakeSuccess : ⏰ 기상성공만 = 기상은 성공했지만 목표는 다 못 채운 사람
   - goalCert    : 🎯 목표인증만 = 목표는 전부 달성했지만 기상은 늦은 사람
   - held        : ⏳ 오늘을 주말대체인증으로 체크해 둔 사람 수 */
function todayStats(){
  const ds = todayStr(); let grow=0, wakeSuccess=0, goalCert=0, held=0;
  if(ds < settings.periodStart || ds > settings.periodEnd){
    return {grow, wakeSuccess, goalCert, held, total:0}; /* 미션 시작 전·종료 후엔 전부 0으로, 미인증으로 집계하지 않음 */
  }
  let total = 0;
  members.forEach(m=>{
    if(isOutsideMission(m, ds)) return; /* 늦은 합류로 아직 시작 전이거나, 오늘이 개인 인증제외기간이면 통계에서 제외 */
    total++;
    const c = getCheckin(m.id, ds);
    if(c && c.held){ held++; return; }
    const hasWake = !!(c && c.wakeupTime && c.wakeupTime!=='보충' && !c.held);
    if(!hasWake) return;
    const onTime = isOnTime(m, c.wakeupTime);
    const gp = goalProgress(m, ds, c.wakeupTime);
    const goalOk = !!c.activityTime && gp.rate >= 1;   /* 목표인증 = 적어둔 목표를 전부 달성 */
    if(onTime && goalOk) grow++;              // 둘 다 성공
    else if(onTime) wakeSuccess++;            // 기상만 성공
    else if(goalOk) goalCert++;               // 목표만 성공
  });
  return {grow, wakeSuccess, goalCert, held, total};
}

/* 목표성공률 = 미션기간 중 지나간 평일들의 '목표 달성률' 평균 (%)
   주말대체인증으로 채운 날은 목표를 따로 판단할 수 없어 분모에서 제외해요 */
function memberGoalRate(memberId, month){
  const member = members.find(m=>m.id===memberId);
  if(!member) return 100;
  let n=0, sum=0;
  periodWeeks().forEach(w=>{
    if(w.start > todayDate) return;
    for(let i=0;i<5;i++){
      const d = addDays(w.start, i);
      if(isFuture(d) || d > todayDate) continue;
      const ds2 = fmtDate(d);
      if(!inMonthOf(ds2, month)) continue;
      if(isOutsideMission(member, ds2)) continue;
      const st = dayStatus(member, ds2);
      if(st.code==='pending' || st.code==='none') continue;
      if(st.code==='madeup' || st.code==='madeup-late') continue; /* 대체인증일은 제외 */
      n++;
      const c = getCheckin(member.id, ds2);
      if(!c || !c.wakeupTime || c.held || c.wakeupTime==='보충') continue; /* 결석 = 0% */
      sum += goalProgress(member, ds2, c.wakeupTime).rate;
    }
  });
  return n ? Math.round(sum / n * 100) : 100;
}

  const memberDays = heroMember? weekDaysChecked(heroMember.id, week) : 0;
  const cumRate = heroMember? memberCumulativeRate(heroMember.id) : 0;

  const dLeft = Math.max(0, Math.round((week.end - todayDate)/86400000));

  for(let i=0;i<7;i++){

    const checked = heroMember? (hasCheckin(heroMember.id,ds) || isMadeup) : false;
    let cls=weekend?'weekend':'', mk='·';
    if(sameDate(d,todayDate)){ cls=(cls?cls+' ':'')+'today'; mk='•'; }
    if(checked){
      cls=(cls?cls+' ':'')+'done'+(isMadeup?' madeup':'');
      /* 캘린더 인증안내와 똑같은 이모지를 쓰도록 dayStatus의 leaf를 그대로 사용 */
      mk = st0 ? (st0.leaf || '😊') : '😊';
    }
    /* 지난 날짜는 눌러서 그날 기록(사진 포함)을 캘린더 상세보기에서 바로 볼 수 있게 함 */
    const clickable = (!isFuture(d) && !sameDate(d,todayDate));
    if(clickable) cls += ' pill-clickable';
    pills += `<div class="wd-pill ${cls}" ${clickable?`data-pastdate="${ds}"`:''}><span class="wd-lbl">${lbls[i]}${weekend?' 대체':''}</span><span class="wd-mk">${mk}</span></div>`;
  }
  const rangeLbl = `${pad(week.start.getMonth()+1)}.${pad(week.start.getDate())}–${pad(week.end.getMonth()+1)}.${pad(week.end.getDate())}`;
  const dotsHtml = weeks.map((w,idx)=>`<span class="week-dot ${idx===wkIdx?'active':''}" data-widx="${idx}"></span>`).join('');

  document.getElementById('hero-card').innerHTML = `
    <div class="hero-top">
      <div>
        <div class="hero-day-label" id="hero-month-link" role="button">${ps.getMonth()+1}월 · ${isCurrentWeek?'This Week':rangeLbl} ›</div>
        <div class="hero-day">${wkIdx+1}<span>주차</span></div>
      </div>
      <div class="hero-period">
        ${pad(ps.getMonth()+1)}.${pad(ps.getDate())} — ${pad(pe.getMonth()+1)}.${pad(pe.getDate())}<br/>
        <span class="hero-goal-pill">🎯 평일 5일 필수</span>
        <span class="hero-goal-pill cumulative">📈 누적 ${cumRate}%</span>
      </div>
    </div>
    <div class="stem-wrap" id="hero-swipe-zone">
      <div class="stem-labels"><span>${heroMember? `<b class="hero-member-name">${heroMember.name}</b>님 `:''}이번 주 <b>${memberDays}</b>/5일 달성</span></div>
      <div class="week-bar-track"><div class="week-bar-fill" style="width:${Math.min(memberDays,5)/5*100}%"></div></div>
      <div class="week-days-row">${pills}</div>
      <div class="week-dots">${dotsHtml}</div>
      <div class="week-hint">👆 좌우로 스와이프하면 다른 주차를 볼 수 있어요<br/>월~금은 <b>필수 인증</b>, 놓친 날은 <b>주말대체인증</b>으로 채울 수 있어요<br/>(당일 주말대체인증체크시 감점 최소)</div>
    </div>`;
  document.getElementById('hero-month-link').addEventListener('click', ()=> switchTab('calendar'));
  document.querySelectorAll('.week-dot').forEach(dot=>{
    dot.addEventListener('click', ()=>{ heroWeekIdx = Number(dot.dataset.widx); renderHero(); });
  });
  document.querySelectorAll('[data-pastdate]').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      calFilterId = '';
      calDetailDate = pill.dataset.pastdate;
      calViewDate = new Date(parseDate(calDetailDate).getFullYear(), parseDate(calDetailDate).getMonth(), 1);
      switchTab('calendar');
      renderCalendar();
    });
  });
  const swipeZone = document.getElementById('hero-swipe-zone');
  let heroTouchX=null, heroTouchY=null;
  swipeZone.addEventListener('touchstart', e=>{
    heroTouchX = e.touches[0].clientX; heroTouchY = e.touches[0].clientY;
  }, {passive:true});
  swipeZone.addEventListener('touchend', e=>{
    if(heroTouchX===null) return;
    const dx = e.changedTouches[0].clientX - heroTouchX;
    const dy = e.changedTouches[0].clientY - heroTouchY;
    heroTouchX = null; heroTouchY = null;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0) changeHeroWeek(1); else changeHeroWeek(-1);
    }
  }, {passive:true});
}

function renderCheckinGrid(el){
  /* ㄱㄴㄷ순 이름 토글 (그리드는 등록순 그대로 유지) */
  const byName = [...members].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const nameOptions = byName.map(m=>`<option value="${m.id}" ${viewingMemberId===m.id?'selected':''}>${m.name}</option>`).join('');
  const cards = members.map(m=>`
    <div class="member-grid-card" data-id="${m.id}">
      <div class="avatar av-sm" style="background:${m.color}">${m.name[0]}</div>
      <div class="nm">${m.name}</div>
    </div>`).join('');
  const pinMember = pinModalMemberId ? members.find(m=>m.id===pinModalMemberId) : null;

  el.innerHTML = `
    ${isCertBlockedNow() ? `<div class="admin-banner"><span class="ic">🌙</span><strong>새벽 12시~4시는 인증 시간이 아니에요</strong><p style="margin-top:4px;">사진 업로드·모닝루틴 체크·저장이 잠시 제한돼요. 4시 이후 다시 시도해주세요.</p></div>` : ''}
    <div class="section-title" style="margin-top:6px;">오늘의 덱스모닝
      <select id="checkin-name-toggle" class="name-toggle" aria-label="이름으로 바로가기">
        <option value="">이름 선택 ▾</option>
        ${nameOptions}
      </select>
    </div>
    <div class="member-grid" id="checkin-member-grid">${cards}</div>
    ${pinMember ? `
    <div class="pin-modal-backdrop" id="pin-modal-backdrop">
      <div class="pin-modal">
        <div class="cert-head"><span class="step-badge" style="background:var(--ink)">🔒</span><h4>${pinMember.name}님 본인 확인</h4></div>
        <p class="pin-modal-desc">PIN 넘버는 핸드폰 끝 4자리 입니다.<br/>인증 사진 업로드시 자동 저장 됩니다.</p>
        <div class="pin-row" style="justify-content:center;">
          <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="pin-input" placeholder="••••" style="flex:0 0 auto; width:160px;"/>
        </div>
        <p class="pin-error" id="pin-error">PIN이 올바르지 않습니다</p>
        <div class="pin-modal-actions">
          <button type="button" class="btn btn-mini ghost" id="pin-modal-cancel" style="flex:1">취소</button>
          <button type="button" class="btn btn-mini" id="pin-modal-confirm" style="flex:1">확인</button>
        </div>
      </div>
    </div>` : ''}
  `;

  const nameToggle = document.getElementById('checkin-name-toggle');
  if(nameToggle){
    nameToggle.addEventListener('change', ()=>{
      const id = nameToggle.value;
      if(!id) return;
      viewingMemberId = id;
      checkinStage = 'view';
      renderCheckin();
    });
  }

  document.querySelectorAll('#checkin-member-grid .member-grid-card').forEach(c=>{
    c.addEventListener('click', ()=>{
      viewingMemberId = c.dataset.id;
      checkinStage = 'view';
      renderCheckin();
    });
  });

  if(pinMember){
    const pinInput = document.getElementById('pin-input');
    pinInput.focus();
    document.getElementById('pin-modal-cancel').addEventListener('click', closePinModal);
    document.getElementById('pin-modal-backdrop').addEventListener('click', (e)=>{ if(e.target.id==='pin-modal-backdrop') closePinModal(); });
    const tryConfirm = ()=>{
      const v = pinInput.value;
      if(v.length!==4 || v!==pinMember.pin){
        document.getElementById('pin-error').style.display='block';
        pinInput.focus();
        return;
      }
      confirmMemberSelection(pinMember.id);
    };
    document.getElementById('pin-modal-confirm').addEventListener('click', tryConfirm);
    pinInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryConfirm(); });
  }
}

/* ===================== 오늘인증: 타인 기록 "보기 전용" 화면 (PIN 불필요) ===================== */
function renderCheckinView(el){
  const member = members.find(m=>m.id===viewingMemberId) || members[0];
  const ds = todayStr();
  const c = getCheckin(member.id, ds) || {};
  const st = dayStatus(member, ds);
  const goals = memberGoals(member).filter(g=>g);
  const checks = (c.routineChecks) || [null,null];

  const photoBox = (id, key)=> key
    ? `<div class="view-photo-box" id="${id}"><span class="view-photo-loading">사진 불러오는 중...</span></div>`
    : `<div class="view-photo-empty">아직 올린 사진이 없어요</div>`;

  const routineRows = goals.length ? goals.map((g,i)=>{
    const ck = checks[i];
    return `<div class="view-routine-row ${ck&&ck.done?'done':''}">
      <span class="view-routine-check">${ck&&ck.done ? '✅' : '⬜'}</span>
      <span class="view-routine-goal">${g}</span>
      ${ck&&ck.done&&ck.time? `<span class="routine-time">✓ ${ck.time}</span>` : ''}
    </div>`;
  }).join('') : `<p class="cert-desc">등록된 모닝루틴이 없어요</p>`;

  el.innerHTML = `
    <div class="checkin-form-header">
      <button type="button" class="checkin-back-btn" id="btn-view-back" aria-label="뒤로가기">← 뒤로가기</button>
    </div>
    <button type="button" class="checkin-go-btn" id="btn-view-edit-mine">
      <span class="checkin-go-avatar" style="background:${member.color}">${member.name[0]}</span>
      <span class="checkin-go-text">
        <span class="checkin-go-line1">${member.name}님의 오늘 기록</span>
        <span class="checkin-go-line2">인증하러가기 →</span>
      </span>
    </button>

    ${(c.wakeupTime || c.held) ? `<div class="status-pill ${st.code}" style="margin-top:12px;">${st.label}${(st.code==='pending' || st.score===0) ? '' : ` · ${fmtScore10(st.score)}점`}</div>` : ''}

    <div id="view-cert-content">
    ${c.held ? `<div class="cert-card hold-card" style="margin-top:12px;"><span><b>⏳ 오늘은 주말대체인증</b>으로 표시돼 있어요</span></div>` : `
    <div class="cert-card" style="margin-top:16px;">
      <div class="cert-head"><span class="step-badge">STEP 1</span><h4>기상 인증</h4></div>
      <p class="cert-desc">${c.wakeupTime ? `기상시간 <b>${c.wakeupTime}</b>` : '아직 기록이 없어요'}</p>
      ${photoBox('view-wakeup-photo-box', c.wakeupPhotoKey)}
    </div>

    <div class="cert-card">
      <div class="cert-head"><span class="step-badge" style="background:var(--green)">STEP 2</span><h4>모닝루틴</h4></div>
      <div class="view-routine-list">${routineRows}</div>
      ${c.activityPhotoKey ? photoBox('view-activity-photo-box', c.activityPhotoKey) : ''}
    </div>`}
    </div>
  `;

  document.getElementById('btn-view-back').addEventListener('click', ()=>{
    checkinStage = 'grid';
    viewingMemberId = null;
    renderCheckin();
  });
  document.getElementById('btn-view-edit-mine').addEventListener('click', ()=> openPinModal(member.id, null));

  /* 이름을 누르면 그 사람의 인증 내용(기상인증/모닝루틴)이 바로 눈에 보이도록,
     화면을 자동으로 살짝 내려서 인증 카드가 보이는 위치까지 스크롤해준다 */
  setTimeout(()=>{
    document.getElementById('view-cert-content')?.scrollIntoView({behavior:'smooth', block:'start'});
  }, 80);

  /* 사진은 '탭해야 보이는 안내칸'이 아니라, 압축된 미리보기 이미지를 바로 불러와 보여준다.
     (미리보기를 한 번 더 탭하면 원본 크기로 크게 볼 수 있음) */
  const loadIntoBox = (boxId, key)=>{
    if(!key) return;
    loadPhoto(key).then(dataUrl=>{
      const box = document.getElementById(boxId);
      if(!box) return;
      if(!dataUrl){ box.outerHTML = '<div class="view-photo-empty">사진을 불러올 수 없어요</div>'; return; }
      box.innerHTML = `<img src="${dataUrl}" alt="인증 사진 미리보기"/>`;
      box.addEventListener('click', ()=> openPhotoOverlay(dataUrl));
    });
  };
  loadIntoBox('view-wakeup-photo-box', c.wakeupPhotoKey);
  loadIntoBox('view-activity-photo-box', c.activityPhotoKey);
}

        <div class="cert-head"><span class="step-badge">STEP 1</span><h4>기상 인증</h4><span class="req">필수</span></div>
        <p class="cert-desc"><span class="li"><span class="bt">✔</span><span>기상목표시간 <b>${member.targetTime}</b> 후 ${settings.graceMin}분까지 기상성공</span></span><span class="li"><span class="bt">✔</span><span>🪥 <b>칫솔에 치약을 짜서 시간이 보이도록</b> 찍은 사진을 첨부하세요</span></span></p>
        <div class="photo-box" id="wakeup-photo-box">${wakeupPhotoData ? photoPreviewHtml(wakeupPhotoData) : photoPlaceholderHtml('wakeup-camera-icon','기상 인증 사진 업로드', c.wakeupPhotoKey? '저장된 사진을 불러오는 중...' : '치약 짠 칫솔 + 타임스탬프가 함께 보이는 사진을 첨부하세요')}</div>
        <input type="file" id="wakeup-photo-input" accept="image/*" hidden />
        <div class="time-field"><label>기상시간</label><input type="time" id="ci-wakeup-time" value="${c.wakeupTime||''}"/></div>
      </div>

      <div class="cert-card" id="block-activity">
        <div class="cert-head"><span class="step-badge" style="background:var(--green)">STEP 2</span><h4>모닝루틴</h4><span class="opt">해빗트래커</span></div>
        <p class="cert-desc"><span class="li"><span class="bt">✔</span><span><span class="imp">기상 인증(STEP 1)을 먼저 완료</span>해야 체크할 수 있어요</span></span><span class="li"><span class="bt">✔</span><span>나만의 모닝루틴 목표를 <b>2개</b> 적어두세요</span></span><span class="li"><span class="bt">✔</span><span><span class="imp">2개 모두 체크해야 만점</span> — 1개만 체크하면 달성률 50%만 반영돼요 (-2.5점)</span></span><span class="li"><span class="bt">✔</span><span><span class="imp">중요:</span> 기상 후 <b>30분~60분 이내</b>에 체크된 루틴만 인정돼요. 이후 체크는 누적성공률에 반영되지 않아요</span></span><span class="li"><span class="bt">✔</span><span>목표문구는 언제든 수정가능</span></span><span class="li"><span class="bt">✔</span><span>모닝루틴 사진으로 인증가능</span></span></p>
        <div class="routine-list" id="routine-list"></div>
        <div class="routine-status" id="routine-status"></div>
